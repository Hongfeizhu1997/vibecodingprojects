- section: "S3-D1: Logic Tests"
  type: logic
  - case: "POS classification works"
    logic: |
      var DataEnrich = {
        classifyPosOrApos: function(d) {
          if (!d) return 'POS';
          var u = String(d).toUpperCase();
          if (u.indexOf('APOS') !== -1) return 'APOS';
          if (u.indexOf('POST WARRANTY') !== -1) return 'APOS';
          if (/\bPW\b/.test(u)) return 'APOS';
          return 'POS';
        }
      };
      console.assert(DataEnrich.classifyPosOrApos('1Y APOS Prem') === 'APOS', 'APOS detection');
      console.assert(DataEnrich.classifyPosOrApos('1Y Onsite NBD') === 'POS', 'POS default');
      console.assert(DataEnrich.classifyPosOrApos(null) === 'POS', 'null → POS');
      console.log('DataEnrich.classifyPosOrApos OK');

