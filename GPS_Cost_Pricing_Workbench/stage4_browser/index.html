<script>

window.onerror = function(msg, src, line, col, err) {

  var p = document.getElementById('_err');

  if (p) p.innerHTML = '<b>JS Error:</b> ' + (err ? err.name + ': ' : '') + msg + '  [line ' + line + ']';

};

window.addEventListener('unhandledrejection', function(e) {

  var p = document.getElementById('_err');

  if (p) p.innerHTML = '<b>Promise Error:</b> ' + (e.reason && e.reason.message ? e.reason.name+': '+e.reason.message : String(e.reason));

});

</script>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box;margin:0;padding:0}

body{font-family:'Montserrat','Helvetica Neue',Arial,sans-serif;font-size:14px;background:#F4F4F4;color:#1E0013;min-height:100vh}

a{color:#E1251B;text-decoration:none}

.nav{background:#11184F;color:#fff;display:flex;align-items:center;padding:0 20px;height:56px;gap:20px;position:sticky;top:0;z-index:100}

.nav-brand{font-weight:700;font-size:15px;letter-spacing:.3px;white-space:nowrap;color:#fff;text-decoration:none;cursor:pointer}.nav-brand:hover{opacity:.75}

.nav-links{display:flex;gap:4px;flex:1}

.nav-links a{color:#c4b5fd;padding:6px 12px;border-radius:4px;font-size:13px;cursor:pointer}

.nav-links a:hover,.nav-links a.active{background:rgba(255,255,255,.15);color:#fff}

.nav-user{color:#a78bfa;font-size:13px;white-space:nowrap}

.container{max-width:1360px;margin:0 auto;padding:20px}

.card{background:#fff;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:20px;margin-bottom:16px}

.card-title{font-size:15px;font-weight:600;margin-bottom:14px;color:#000000}

.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:4px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:background .15s}

.btn-primary{background:#E1251B;color:#fff;border-color:#E1251B}.btn-primary:hover{background:#64131E}

.btn-secondary{background:#fff;color:#374151;border-color:#d1d5db}.btn-secondary:hover{background:#EAEEF5}

.btn-danger{background:#dc2626;color:#fff;border-color:#dc2626}.btn-danger:hover{background:#b91c1c}

.btn-success{background:#065f46;color:#fff;border-color:#065f46}.btn-success:hover{background:#15803d}

.btn-sm{padding:4px 10px;font-size:12px}

.btn:disabled{opacity:.5;cursor:not-allowed}

.tbl{width:100%;border-collapse:collapse;font-size:13px}

.tbl th{background:#FAFAFA;text-align:left;padding:8px 10px;font-weight:600;color:#374151;border-bottom:2px solid #e5e7eb;white-space:nowrap}

.tbl td{padding:7px 10px;border-bottom:1px solid #f1f5f9;vertical-align:middle}

.tbl tr:hover td{background:#fafafa}

.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;white-space:nowrap}

.badge-draft{background:#fef9c3;color:#854d0e}

.badge-submitted{background:#dbeafe;color:#1e40af}

.sev-critical{background:#fee2e2;color:#991b1b}

.sev-systemic{background:#ffedd5;color:#9a3412}

.sev-warning{background:#fef9c3;color:#854d0e}

.sev-ok{background:#ecfdf5;color:#065f46}

.sev-clear{background:#ecfdf5;color:#065f46}

.status-blocked{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}

.status-systemic{background:#ffedd5;color:#9a3412;border:1px solid #fdba74}

.status-warnings{background:#fef9c3;color:#854d0e;border:1px solid #fde68a}

.status-clear{background:#ecfdf5;color:#065f46;border:1px solid #86efac}

.layer-badge{background:#FAECEB;color:#64131E;font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px}

.form-row{display:grid;gap:12px;margin-bottom:12px}

.form-row-2{grid-template-columns:1fr 1fr}

.form-row-3{grid-template-columns:1fr 1fr 1fr}

.form-row-4{grid-template-columns:1fr 1fr 1fr 1fr}

.form-group{display:flex;flex-direction:column;gap:4px}

.form-label{font-size:12px;font-weight:600;color:#374151}

.form-control{padding:7px 10px;border:1px solid #d1d5db;border-radius:4px;font-size:13px;color:#1E0013;background:#fff}

.form-control:focus{outline:none;border-color:#E1251B;box-shadow:0 0 0 2px rgba(226,35,42,.1)}

select.form-control{cursor:pointer}

.tabs{display:flex;gap:0;border-bottom:2px solid #e5e7eb;margin-bottom:20px}

.tab{padding:10px 18px;font-size:13px;font-weight:500;color:#6F7170;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px}

.tab:hover{color:#374151}

.tab.active{color:#E1251B;border-bottom-color:#E1251B;font-weight:600}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:1000}

.modal-overlay.hidden{display:none}

.modal-box{background:#fff;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.2);width:560px;max-width:95vw;max-height:90vh;display:flex;flex-direction:column}

.modal-box.wide{width:760px}

.modal-header{padding:16px 20px;border-bottom:1px solid #e5e7eb;font-weight:700;font-size:15px;color:#000000}

.modal-body{padding:20px;overflow-y:auto;flex:1}

.modal-footer{padding:12px 20px;border-top:1px solid #e5e7eb;display:flex;justify-content:flex-end;gap:8px}

#toast-container{position:fixed;bottom:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px}

.toast{padding:10px 16px;border-radius:6px;font-size:13px;font-weight:500;box-shadow:0 4px 12px rgba(0,0,0,.15);animation:slideIn .2s ease}

.toast-success{background:#166534;color:#fff}

.toast-error{background:#991b1b;color:#fff}

.toast-info{background:#64131E;color:#fff}

@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}

.stat-card{background:#fff;border:1px solid #E6E2E4;border-radius:4px;padding:14px;text-align:center}

.stat-card .stat-val{font-size:26px;font-weight:700;color:#000000}

.stat-card .stat-label{font-size:11px;color:#6F7170;margin-top:2px}

.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}

.page-header h1{font-size:20px;font-weight:700;color:#000000}

.text-muted{color:#6F7170}.text-sm{font-size:12px}.text-right{text-align:right}

.hidden{display:none!important}

.section-title{font-size:13px;font-weight:600;color:#374151;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid #e5e7eb}

hr{border:none;border-top:1px solid #e5e7eb;margin:14px 0}

.upload-zone{border:2px dashed #d1d5db;border-radius:4px;padding:24px;text-align:center;cursor:pointer;transition:border-color .2s}

.upload-zone:hover,.upload-zone.drag-over{border-color:#E1251B;background:#FAECEB}

.upload-zone .upload-icon{font-size:28px;margin-bottom:6px}

.upload-zone p{color:#6F7170;font-size:13px}

.gve-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}

.dot-critical{background:#dc2626}.dot-systemic{background:#ea580c}.dot-warning{background:#d97706}.dot-ok{background:#065f46}

.resolved-row td{color:#9ca3af}

.filter-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}

.alert{padding:12px 16px;border-radius:6px;margin-bottom:14px;font-size:13px}

.alert-blocked{background:#fee2e2;border:1px solid #fca5a5;color:#991b1b}

.alert-systemic{background:#ffedd5;border:1px solid #fdba74;color:#9a3412}

.alert-warnings{background:#fef9c3;border:1px solid #fde68a;color:#854d0e}

.alert-clear{background:#dcfce7;border:1px solid #86efac;color:#166534}

.settings-tabs{display:flex;gap:0;border-bottom:2px solid #e5e7eb;margin-bottom:20px;flex-wrap:wrap}

.settings-tab{padding:8px 14px;font-size:13px;font-weight:500;color:#6F7170;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px}

.settings-tab.active{color:#E1251B;border-bottom-color:#E1251B}

.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#000 0%,#1A1A1A 100%)}

.login-card{background:#fff;border-radius:12px;padding:40px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,.3)}

.login-card h1{font-size:22px;font-weight:700;color:#000000;margin-bottom:4px}

.login-card p{color:#6F7170;font-size:13px;margin-bottom:24px}

.err-item{color:#991b1b;font-size:12px;padding:2px 0}

.pagination{display:flex;align-items:center;gap:6px;margin-top:10px}

.pagination button{padding:4px 10px;font-size:12px;border:1px solid #d1d5db;background:#fff;border-radius:4px;cursor:pointer}

.pagination button:disabled{opacity:.4;cursor:not-allowed}

.pagination .page-info{font-size:12px;color:#6F7170;margin:0 6px}

.drift-delta{font-size:11px;padding:1px 5px;border-radius:3px}

.drift-up{background:#fee2e2;color:#991b1b}

.drift-down{background:#ecfdf5;color:#065f46}

</style>

<div class="modal-overlay hidden" id="modal-overlay">

  <div class="modal-box" id="modal-box">

    <div class="modal-header" id="modal-header"></div>

    <div class="modal-body" id="modal-body"></div>

    <div class="modal-footer" id="modal-footer"></div>

  </div>

</div>

<div id="toast-container"></div>

<div id="app"><div style="padding:40px;text-align:center;color:#374151"><h2>Loading...</h2><p id="_err" style="color:#991b1b"></p></div></div>



<script>

'use strict';

console.log('[GPS4] script start');

document.getElementById('_err').textContent = 'Script starting…';



// ══ CONSTANTS ═════════════════════════════════════════════════════════════════



const DEFAULT_SETTINGS = {

  contingency_new_1_3yr:'0.12', contingency_new_4_5yr:'0.18',

  contingency_mature_refresh_1_3yr:'0.08', contingency_mature_refresh_4_5yr:'0.13',

  contingency_mature_1_3yr:'0.05', contingency_mature_4_5yr:'0.09',

  overhead_total_fixed_cost:'0', overhead_projected_units:'0',

  ratio_band_3yr_1yr_min:'1.8', ratio_band_3yr_1yr_max:'2.8',

  ratio_band_5yr_3yr_min:'1.3', ratio_band_5yr_3yr_max:'1.7',

  ratio_band_4yr_2yr_min:'1.3', ratio_band_4yr_2yr_max:'2.0',

  cross_geo_deviation_pct:'0.20', yoy_cell_change_pct:'0.25',

  yoy_ratio_change_pct:'0.15', yoy_geo_avg_change_pct:'0.20',

};



const RATIO_PAIRS = [

  {hi:3, lo:1, minKey:'ratio_band_3yr_1yr_min', maxKey:'ratio_band_3yr_1yr_max', label:'3yr/1yr'},

  {hi:5, lo:3, minKey:'ratio_band_5yr_3yr_min', maxKey:'ratio_band_5yr_3yr_max', label:'5yr/3yr'},

  {hi:4, lo:2, minKey:'ratio_band_4yr_2yr_min', maxKey:'ratio_band_4yr_2yr_max', label:'4yr/2yr'},

];



// ══ DATABASE ══════════════════════════════════════════════════════════════════



const db = new Dexie('GPSPricingStage4V1');

db.version(1).stores({

  cycles:         '++id, &name',

  tier_sequence:  '++id, &tier_name, sort_order',

  skus:           '++id, [cycle_id+part_number], cycle_id',

  sku_prices:     '++id, [sku_id+region], sku_id, cycle_id',

  prior_baseline: '++id, [cycle_id+part_number+region], cycle_id',

  gve_results:    '++id, cycle_id, layer, severity, is_resolved',

  settings:       '&key',

  cycle_maturity: '++id, [cycle_id+tier_name], cycle_id',

});

// v2: add-on flag fields stored on skus (no schema index change needed)

db.version(2).stores({});



async function initDB() {

  const cnt = await db.settings.count();

  if (cnt === 0) {

    await db.settings.bulkAdd(

      Object.entries(DEFAULT_SETTINGS).map(([key, value]) => ({key, value, updated_by:'system', updated_at:now()}))

    );

  }

}



async function getSetting(key) {

  const row = await db.settings.get(key);

  return row ? parseFloat(row.value) || row.value : (DEFAULT_SETTINGS[key] ?? null);

}

async function getSettings() {

  const rows = await db.settings.toArray();

  const map = {};

  rows.forEach(r => map[r.key] = r.value);

  return map;

}

async function saveSetting(key, value, user) {

  await db.settings.put({key, value:String(value), updated_by:user, updated_at:now()});

}



// ══ STATE ═════════════════════════════════════════════════════════════════════



let currentUser = localStorage.getItem('gps_user') || null;

let currentCycleId = null;

let currentTab = 'import';

let settingsTab = 'contingency';



// ══ UTILS ═════════════════════════════════════════════════════════════════════



function el(id) { return UI.$el(id) || document.getElementById(id); }

function app() { return el('app'); }

function now() { return new Date().toISOString(); }  // kept for Dexie compat

function fmt(v, d=2) {

  if (v==null||v===''||isNaN(v)) return '—';

  return Number(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});

}

function pct(v) {

  if (v==null||v===''||isNaN(v)) return '—';

  return (Number(v)*100).toFixed(1)+'%';

}

function safeFloat(v) {

  if (v==null) return null;

  if (typeof v==='number') return isNaN(v)?null:v;

  const s = String(v).replace(/[$,%,\s]/g,'');

  const f = parseFloat(s);

  return isNaN(f) ? null : f;

}

function safeStr(v) {

  if (v==null) return null;

  const s = String(v).trim();

  return s||null;

}

function toast(msg, type='info') {

  const d=document.createElement('div');

  d.className=`toast toast-${type}`; d.textContent=msg;

  el('toast-container').appendChild(d);

  setTimeout(()=>d.remove(), 3500);

}

function showModal(title, body, footer, wide=false) {

  el('modal-header').textContent=title;

  el('modal-body').innerHTML=body;

  el('modal-footer').innerHTML=footer||'<button class="btn btn-secondary" onclick="hideModal()">Close</button>';

  el('modal-box').className='modal-box'+(wide?' wide':'');

  el('modal-overlay').classList.remove('hidden');

}

function hideModal() { UI.hideModal(); }

el('modal-overlay').addEventListener('click', e=>{ if(e.target===el('modal-overlay')) hideModal(); });



function cycleStatusBadge(s) {

  return s==='submitted'

    ? '<span class="badge badge-submitted">Submitted</span>'

    : '<span class="badge badge-draft">Draft</span>';

}

function sevBadge(s) {

  const cls={Critical:'sev-critical',Systemic:'sev-systemic',Warning:'sev-warning',OK:'sev-ok',Clear:'sev-clear'};

  return `<span class="badge ${cls[s]||'badge-draft'}">${s}</span>`;

}

function layerBadge(l) { return `<span class="layer-badge">L${l}</span>`; }



// ══ ROUTER ════════════════════════════════════════════════════════════════════



async function route() {

  if (!currentUser) { renderLogin(); return; }

  const hash = location.hash || '#';

  if (hash==='#settings') { await renderSettings(); return; }

  const m = hash.match(/^#cycle\/(\d+)(?:\/(\w+))?/);

  if (m) {

    currentCycleId = parseInt(m[1]);

    currentTab = m[2] || 'import';

    await renderCycle();

  } else {

    await renderDashboard();

  }

}

window.addEventListener('hashchange', route);

function navigate(h) { location.hash=h; }



// ══ LOGIN ═════════════════════════════════════════════════════════════════════



function renderLogin() {

  app().innerHTML=`

  <div class="login-page">

    <div class="login-card">

      <h1>GPS Cost Pricing Workbench</h1>

      <p>Stage 4 —'GVE Validation Engine</p>

      <div class="form-group" style="margin-bottom:16px">

        <label class="form-label">Your Name</label>

        <input id="login-name" class="form-control" placeholder="e.g. Jane Smith" autofocus>

      </div>

      <button class="btn btn-primary" style="width:100%" onclick="doLogin()">Enter</button>

    </div>

  </div>`;

  el('login-name').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

}

function doLogin() {

  const name=el('login-name').value.trim();

  if (!name) { toast('Please enter your name','error'); return; }

  currentUser=name; localStorage.setItem('gps_user',name); route();

}

function logout() { localStorage.removeItem('gps_user'); currentUser=null; route(); }



// ══ DASHBOARD ═════════════════════════════════════════════════════════════════




function renderBridgeDashboard() {
  var div = document.getElementById('dashboard-bridge-card');
  if (!div) return;
  try {
    if (typeof Bridge !== 'undefined' && Bridge.hasDataFrom && Bridge.hasDataFrom(3)) {
      var meta = Bridge.getMeta(3) || {};
      var data = Bridge.loadFromStage(3) || {};
      div.innerHTML = '<div class="card" style="margin-bottom:16px;background:#f0fdf4;border:1px solid #bbf7d0">' +
        '<div style="display:flex;align-items:center;justify-content:space-between">' +
        '<div><span style="font-weight:600;color:#166534;font-size:15px">📥 Data Available from Stage 3</span>' +
        '<p style="color:#166534;margin:4px 0 0 0;font-size:13px">' + (meta.cycleName||'Stage 3') + ' — ' + (data.rowCount||0) + ' SKUs ready to import</p></div>' +
        '<button class="btn btn-primary btn-sm" onclick="showCreateCycle()">+ New Cycle to Import</button>' +
        '</div></div>';
    } else {
      div.innerHTML = '';
    }
  } catch(e) { div.innerHTML = ''; }
}


async function renderDashboard() {

  const cycles=await db.cycles.orderBy('id').reverse().toArray();

  app().innerHTML=`

  <nav class="nav">

    <a class="nav-brand" href="../GPS_Cost_Pricing_Workbench.html">GPS Cost Pricing Workbench</a>

    <div class="nav-links">

      <a class="active" href="#">Dashboard</a>

      <a href="#settings">Settings</a>

    </div>

    <span class="nav-user">${currentUser} &nbsp;|&nbsp; <a href="#" onclick="logout()" style="color:#a78bfa">Sign out</a></span>

  </nav>

  <div class="container">
<div class="step-indicator" style="display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap"><span style="background:#4263C7;color:#fff;padding:4px 12px;border-radius:4px;font-size:12px;font-weight:600">2. GVE Validation</span><span style="color:#6F7170;font-size:12px;padding:4px 0">Validate → Cross-Check → Export</span></div>

    <div class="page-header">

      <h1>Pricing Cycles</h1>

      <button class="btn btn-primary" onclick="showCreateCycle()">+ New Cycle</button>

    </div>

    <div id="dashboard-bridge-card"></div>

    <div class="card">
    ${cycles.length > 0 ? `
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px">
      <div class="card" style="text-align:center;padding:12px"><div style="font-size:24px;font-weight:700;color:#2563eb">${cycles.length}</div><div style="font-size:12px;color:#6F7170">Total Cycles</div></div>
      <div class="card" style="text-align:center;padding:12px"><div style="font-size:24px;font-weight:700;color:#065f46">${cycles.filter(function(c){return c.status==='submitted'}).length}</div><div style="font-size:12px;color:#6F7170">Submitted</div></div>
      <div class="card" style="text-align:center;padding:12px"><div style="font-size:24px;font-weight:700;color:#d97706">${cycles.filter(function(c){return c.status==='draft'}).length}</div><div style="font-size:12px;color:#6F7170">Draft</div></div>
      <div class="card" style="text-align:center;padding:12px"><div style="font-size:24px;font-weight:700;color:#9333ea">${cycles.length ? (cycles[0].created_at||'').slice(0,10) : '—'}</div><div style="font-size:12px;color:#6F7170">Latest</div></div>
    </div>
    ` : ''}


      ${cycles.length===0

        ? '<p class="text-muted" style="text-align:center;padding:30px">No cycles yet.</p>'

        : `<table class="tbl">

          <thead><tr><th>Cycle Name</th><th>Fiscal Year</th><th>Status</th><th>Created By</th><th>Created At</th><th>Submitted At</th><th></th></tr></thead>

          <tbody>${cycles.map(c=>`

            <tr>

              <td><strong><a href="#cycle/${c.id}/import">${c.name}</a></strong></td>

              <td>${c.fiscal_year||'—'}</td>

              <td>${cycleStatusBadge(c.status)}</td>

              <td>${c.created_by||'—'}</td>

              <td class="text-muted text-sm">${(c.created_at||'').slice(0,16).replace('T',' ')}</td>

              <td class="text-muted text-sm">${c.submitted_at?(c.submitted_at||'').slice(0,16).replace('T',' '):'—'}</td>

              <td><a class="btn btn-secondary btn-sm" href="#cycle/${c.id}/import">Open →</a></td>

            </tr>`).join('')}

          </tbody></table>`}

    </div>

  </div>`;

  renderBridgeDashboard();
  try {
    if (typeof Bridge !== 'undefined' && Bridge.hasDataFrom && Bridge.hasDataFrom(3)) {
      setTimeout(function() {
        var meta = Bridge.getMeta(3) || {};
        var name = (meta.cycleName || 'Stage3_Import') + ' (from Stage 3)';
        var fy = meta.fiscalYear || new Date().getFullYear().toString();
        // Pre-fill and show create dialog
        showCreateCycle();
        var nEl = document.getElementById('c-name');
        var fEl = document.getElementById('c-fy');
        if (nEl) nEl.value = name;
        if (fEl) fEl.value = fy;
      }, 300);
    }
  } catch(e) {}
}

function showCreateCycle() {

  showModal('New Pricing Cycle',

  // Check for unresolved Critical violations

  const critical = await db.gve_results

    .where('cycle_id').equals(cycleId)

    .filter(r => r.severity==='Critical' && !r.is_resolved)

    .count();

  await db.cycles.update(cycleId, {status:'submitted', submitted_at:now(), submitted_by:currentUser});

async function importFromStage3Bridge() {
  if (typeof Bridge === 'undefined' || !Bridge.hasDataFrom) {
    toast('Bridge module not loaded', 'error'); return;
  }
  if (!Bridge.hasDataFrom(3)) {
    toast('No data from Stage 3 found', 'error'); return;
  }
  
  var bridgeData = Bridge.loadFromStage(3);
  if (!bridgeData || !bridgeData.data || !bridgeData.data.length) {
    toast('Bridge data is empty', 'error'); return;
  }
  
  var rows = bridgeData.data;
  var meta = Bridge.getMeta(3) || {};
  toast('Importing ' + rows.length + ' SKUs from Stage 3 (' + (meta.cycleName||'') + ')...', 'info');
  
  try {
    // Clear existing data for this cycle
    var existingSkus = await db.skus.where('cycle_id').equals(currentCycleId).toArray();
    if (existingSkus.length) {
      var skuIds = existingSkus.map(function(s) { return s.id; });
      await db.sku_prices.where('sku_id').anyOf(skuIds).delete();
      await db.skus.where('cycle_id').equals(currentCycleId).delete();
    }
    await db.gve_results.where('cycle_id').equals(currentCycleId).delete();
    
    // Insert new data from Bridge
    var regions = {};
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var region = r.region || 'Default';
      if (!regions[region]) regions[region] = true;
      
      var skuId = await db.skus.add({
        cycle_id: currentCycleId,
        part_number: r.part_number || '',
        tier: r.tier || '',
        base_warranty: r.upgrade_years || '',
        upgrade_description: r.upgrade_from_type || '',
        delivery_type: r.delivery_type || '',
        upgrade_years: r.upgrade_years || '',
        included_adp: r.addon_adp ? 'Y' : 'N',
        included_kyd: r.addon_kyd ? 'Y' : 'N',
        included_sbty: r.addon_sbty ? 'Y' : 'N',
        included_ticru: r.addon_ticru ? 'Y' : 'N',
        included_premier: r.addon_premier ? 'Y' : 'N',
        upgrade_from_type: r.upgrade_from_type || '',
        upgrade_from_term: r.upgrade_from_term || '',
      });
      
      await db.sku_prices.add({
        sku_id: skuId,
        cycle_id: currentCycleId,
        region: region,
        sales_cost: r.sales_cost != null ? Number(r.sales_cost) : 0,
        channel_price: null,
        list_price: null,
      });
    }
    
    var regionCount = Object.keys(regions).length;
    Audit.log.bridgeReceive(3, rows.length, currentUser, 4);
    toast('Imported ' + rows.length + ' SKUs across ' + regionCount + ' region(s) from Stage 3', 'success');
    await renderImportTab();
    
  } catch(e) {
    toast('Bridge import error: ' + e.message, 'error');
    console.error(e);
  }
}

async function handleExcelImport(e) { if(e.target.files[0]) await handleExcelFile(e.target.files[0]); }
async function handleExcelFile(file) {
  el('import-result').innerHTML='<span class="text-muted text-sm">Parsing…</span>';
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array', cellDates:true, raw:false});
    const parsed = parseStage4Excel(wb);
    if (parsed.error) { toast('Parse error: '+parsed.error,'error'); el('import-result').innerHTML=''; return; }

    const existingSkus = await db.skus.where('cycle_id').equals(currentCycleId).toArray();
    const skuIds = existingSkus.map(s=>s.id);
    if (skuIds.length) {
      await db.sku_prices.where('sku_id').anyOf(skuIds).delete();
      await db.skus.where('cycle_id').equals(currentCycleId).delete();
    }
    await db.gve_results.where('cycle_id').equals(currentCycleId).delete();

    const existingTiers = await db.tier_sequence.toArray();
    const existingTierNames = new Set(existingTiers.map(t=>t.tier_name));
    const maxOrder = existingTiers.reduce((m,t)=>Math.max(m,t.sort_order),0);
    let tierOrder = maxOrder;
    for (const t of (parsed.tiers||[])) {
      if (!existingTierNames.has(t)) {
        tierOrder++;
        await db.tier_sequence.add({tier_name:t, sort_order:tierOrder});
      }
    }

    let skuCount=0, priceCount=0;
    for (const row of parsed.rows) {
      const skuId = await db.skus.add({
        cycle_id:currentCycleId, part_number:row.part_number, tier:row.tier,
        base_warranty:row.base_warranty, upgrade_description:row.upgrade_description,
        delivery_type:row.delivery_type, upgrade_years:row.upgrade_years,
        included_adp:row.included_adp, included_kyd:row.included_kyd,
        included_sbty:row.included_sbty, included_ticru:row.included_ticru,
        included_premier:row.included_premier,
        upgrade_from_type:row.upgrade_from_type, upgrade_from_term:row.upgrade_from_term,
      });
      skuCount++;
      for (const [region, prices] of Object.entries(row.prices)) {
        await db.sku_prices.add({sku_id:skuId, cycle_id:currentCycleId, region,
          sales_cost:prices.sales_cost, channel_price:prices.channel_price,
          list_price:prices.list_price});
        priceCount++;
      }
    }

    const warnings = parsed.warnings||[];
    el('import-result').innerHTML=`
      <div class="alert alert-clear">Imported ${skuCount} SKUs, ${priceCount} price records across ${parsed.regions?.length||0} regions.
        ${warnings.length?`<br><strong>${warnings.length} warning(s):</strong> ${warnings.slice(0,3).join('; ')}`:''}
      </div>`;
    toast(`Imported ${skuCount} SKUs`, 'success');
    await renderImportTab();
  } catch(e) {
    toast('Import failed: '+e.message,'error');
    el('import-result').innerHTML=`<div class="alert alert-blocked">Error: ${e.message}</div>`;
  }
}

async function saveBaseline() {
  const text=el('baseline-csv').value.trim();
  if (!text) { toast('No CSV text','error'); return; }
  const lines=text.split('\n').filter(l=>l.trim());
  if (lines.length<2) { toast('Need header + data rows','error'); return; }
  const headers=lines[0].split(',').map(h=>h.trim().toLowerCase());
  const pnIdx=headers.indexOf('part_number'), regIdx=headers.indexOf('region'), scIdx=headers.indexOf('prior_sales_cost');
  if (pnIdx<0||regIdx<0||scIdx<0) { toast('CSV must have part_number, region, prior_sales_cost columns','error'); return; }

  await db.prior_baseline.where('cycle_id').equals(currentCycleId).delete();
  let count=0;
  for (let i=1;i<lines.length;i++) {
    const cols=lines[i].split(',').map(c=>c.trim());
    const pn=cols[pnIdx], reg=cols[regIdx], sc=parseFloat(cols[scIdx]);
    if (pn&&reg&&!isNaN(sc)) {
      await db.prior_baseline.put({cycle_id:currentCycleId, part_number:pn, region:reg, prior_sales_cost:sc, entered_by:currentUser, entered_at:now()});
      count++;
    }
  }
  toast(`Saved ${count} baseline entries`,'success');
  el('baseline-csv').value='';
  await renderImportTab();
}

function sevOrder(s) { return {Critical:0,Systemic:1,Warning:2,OK:3}[s]??9; }



function renderMatrixTable(allPrices, tierSeq, violMap) {

  const regionFilter = el('m-region')?.value||'';

  const dtFilter = el('m-dtype')?.value||'';



  const filtered = allPrices.filter(r=>

    (!regionFilter||r.region===regionFilter)&&

    (!dtFilter||r.delivery_type===dtFilter)

  );



  // Group by (tier, upgrade_years, delivery_type, region)

  const groups={};

  for (const r of filtered) {

    const k=`${r.tier}|${r.upgrade_years}|${r.delivery_type}|${r.region}`;

    if (!groups[k]) groups[k]={tier:r.tier, years:r.upgrade_years, dtype:r.delivery_type,

      region:r.region, sc:[]};

    if (r.sales_cost!=null) groups[k].sc.push(r.sales_cost);

  }



  const avg = arr => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null;

  const tierOrder = {}; tierSeq.forEach((t,i)=>tierOrder[t.tier_name]=i);



  const rows = Object.values(groups).sort((a,b)=>{

    const ta=(tierOrder[a.tier]??99)-(tierOrder[b.tier]??99);

    if (ta!==0) return ta;

    if ((a.years??0)!==(b.years??0)) return (a.years??0)-(b.years??0);

    return (a.region||'').localeCompare(b.region||'');

  });



  const dotHtml = (tier, years, region) => {

    const k=`${tier||''}|${years||''}|${region||''}`;

    const sev=violMap[k];

    if (!sev) return '<span class="gve-dot dot-ok" title="OK"></span>';

    const cls={Critical:'dot-critical',Systemic:'dot-systemic',Warning:'dot-warning'};

    return `<span class="gve-dot ${cls[sev]||'dot-ok'}" title="${sev}"></span>`;

  };



  el('matrix-table').innerHTML = rows.length===0

    ? '<div class="card"><p class="text-muted" style="text-align:center;padding:20px">No data for selected filters.</p></div>'

    : `<div class="card" style="overflow-x:auto">

      <table class="tbl">

        <thead><tr><th>Tier</th><th>Yrs</th><th>Type</th><th>Region</th><th>Avg Sales Cost</th><th>SKUs</th><th>GVE</th></tr></thead>

        <tbody>${rows.map(r=>{

          const asc=avg(r.sc);

          return `<tr>

            <td><strong>${r.tier||'—'}</strong></td>

            <td>${r.years??'—'}</td>

            <td>${r.dtype||'—'}</td>

            <td>${r.region||'—'}</td>

            <td class="text-right">${fmt(asc)}</td>

            <td>${r.sc.length}</td>

            <td>${dotHtml(r.tier, r.years, r.region)}</td>

          </tr>`;

        }).join('')}

        </tbody>

      </table>

    </div>`;

}



// Helper: load all SKU + price records for a cycle as a flat list

async function loadCyclePrices(cycleId) {

  const skus = await db.skus.where('cycle_id').equals(cycleId).toArray();

  if (!skus.length) return [];

  const skuIds = skus.map(s=>s.id);

  const prices = await db.sku_prices.where('sku_id').anyOf(skuIds).toArray();

  const skuMap = {}; skus.forEach(s=>skuMap[s.id]=s);

  return prices.map(p => ({...skuMap[p.sku_id], ...p, sku_row_id:skuMap[p.sku_id]?.id}));

}

function renderGVEAlert(summary) {

  const {Critical, Systemic, Warning} = summary;

  let cls='alert-clear', label='All Clear', detail='No violations found.';

  if (Critical.unresolved>0) { cls='alert-blocked'; label='BLOCKED'; detail=`${Critical.unresolved} unacknowledged Critical violation(s). Must acknowledge before submitting.`; }

  else if (Systemic.unresolved>0) { cls='alert-systemic'; label='SYSTEMIC'; detail=`${Systemic.unresolved} Systemic violation(s) unacknowledged.`; }

  else if (Warning.unresolved>0) { cls='alert-warnings'; label='WARNINGS'; detail=`${Warning.unresolved} Warning(s) unacknowledged.`; }

  return `<div class="alert ${cls}"><strong>${label}</strong> —'${detail}

    &nbsp; Critical: ${Critical.unresolved}/${Critical.total} unresolved &nbsp;|&nbsp;

    Systemic: ${Systemic.unresolved}/${Systemic.total} &nbsp;|&nbsp;

    Warning: ${Warning.unresolved}/${Warning.total}

  </div>`;

}



async function getGVESummary(cycleId) {

  const results=await db.gve_results.where('cycle_id').equals(cycleId).toArray();

  const summary={Critical:{total:0,resolved:0,unresolved:0},Systemic:{total:0,resolved:0,unresolved:0},Warning:{total:0,resolved:0,unresolved:0}};

  for (const r of results) {

    const s=summary[r.severity];

    if (!s) continue;

    s.total++;

    if (r.is_resolved) s.resolved++; else s.unresolved++;

  }

  return summary;

}

async function showBatchAckModal() {
  const viols = await db.gve_results.where('cycle_id').equals(currentCycleId).filter(r => !r.is_resolved).toArray();
  if (!viols.length) { toast('No unacknowledged violations', 'info'); return; }
  const groups = {};
  viols.forEach(v => { const key = v.violation_type + '|' + (v.region||'') + '|' + (v.tier||''); if (!groups[key]) groups[key] = []; groups[key].push(v); });
  const groupList = Object.entries(groups).map(([key,items]) => { const parts = key.split('|'); return { type: parts[0], region: parts[1], tier: parts[2], count: items.length, ids: items.map(v=>v.id) }; });
  const groupRows = groupList.map((g, i) => `
    <tr><td><input type="checkbox" id="batch-grp-${i}" checked onchange="updateBatchCount()"></td>
    <td>${g.type}</td><td>${g.region||'—'}</td><td>${g.tier||'—'}</td><td>${g.count} violation(s)</td>
    <td style="display:none">${g.ids.join(',')}</td></tr>`).join('');

    `<p style="margin-bottom:12px;color:#374151">Select groups to acknowledge with the same explanation.</p>

    `<button class="btn btn-secondary" onclick="hideModal()">Cancel</button>
     <button class="btn btn-success" id="batch-ack-btn" onclick="batchAcknowledge()">Acknowledge <span id="batch-count"></span></button>`);

function updateBatchCount() {
  let count=0; document.querySelectorAll('[id^="batch-grp-"]').forEach(cb => { if(cb.checked) { const hidden=cb.closest('tr').querySelector('td:nth-child(6)'); if(hidden) count+=parseInt(hidden.textContent)||0; }});
  const el=document.getElementById('batch-count'); if(el) el.textContent=count>0?'('+count+' items)':'';
}
async function batchAcknowledge() {
  const exp=el('batch-ack-exp').value.trim(); if(!exp){toast('Explanation required','error');return;}
  const ids=[]; document.querySelectorAll('[id^="batch-grp-"]:checked').forEach(cb=>{const hidden=cb.closest('tr').querySelector('td:nth-child(6)');if(hidden)hidden.textContent.split(',').forEach(id=>{const n=parseInt(id);if(n)ids.push(n);});});
  if(!ids.length){toast('No groups selected','error');return;}
  const now=new Date().toISOString(); for(const id of ids) await db.gve_results.update(id,{is_resolved:1,explanation:exp,resolved_by:currentUser,resolved_at:now});
  hideModal(); toast('Acknowledged '+ids.length+' violation(s)','success'); await refreshViolTable();
  const summary=await getGVESummary(currentCycleId); const alertEl=el('tab-content').querySelector('.alert'); if(alertEl)alertEl.outerHTML=renderGVEAlert(summary);
}
function showAckModal(violId) {

    `<div class="form-group"><label class="form-label">Explanation (required)</label>

      <textarea id="resolve-exp" class="form-control" rows="4" placeholder="Explain why this violation is accepted or has been addressed—'></textarea>

    </div>`,

    `<button class="btn btn-secondary" onclick="hideModal()">Cancel</button>

     <button class="btn btn-success" onclick="ackViolation(${violId})">Acknowledge</button>`

  );

}

async function ackViolation(violId) {

  const exp=el('resolve-exp').value.trim();

  if (!exp) { toast('Explanation required','error'); return; }

  await db.gve_results.update(violId, {is_resolved:1, explanation:exp, resolved_by:currentUser, resolved_at:now()});

  hideModal(); toast('Discrepancy acknowledged','success');

  await refreshViolTable();

  // Refresh alert

  const summary=await getGVESummary(currentCycleId);

  const alertEl=el('tab-content').querySelector('.alert');

  if (alertEl) alertEl.outerHTML=renderGVEAlert(summary);

}

async function unackViolation(violId) {

  await db.gve_results.update(violId, {is_resolved:0, explanation:null, resolved_by:null, resolved_at:null});

  toast('Acknowledgment undone','info');

  await refreshViolTable();

}



async function runGVE() {

  const btn=el('gve-btn');

  try {

    for (const v of violations)

      await db.gve_results.add({...v, cycle_id:currentCycleId, is_resolved:0, created_at:now()});

// ══ EXCEL PARSER ══════════════════════════════════════════════════════════════



function parseStage4Excel(workbook) {

  // Find pricing sheet

  const sheetName = workbook.SheetNames.find(n=>n.toLowerCase().includes('pricing'))

                    || workbook.SheetNames[0];

  if (!sheetName) return {error:'No sheets found in workbook'};

  const ws = workbook.Sheets[sheetName];

  const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:null, raw:false});



  // Find subheader row: contains "Cost" and "C-Price" or "Channel"

  let subHeaderRow=-1;

  for (let i=0;i<Math.min(rows.length,10);i++) {

    const r=rows[i]||[];

    const s=r.map(c=>String(c||'').toLowerCase()).join(' ');

    if (s.includes('cost')&&(s.includes('c-price')||s.includes('channel')||s.includes('l-price'))) {

      subHeaderRow=i; break;

    }

  }

  if (subHeaderRow<0) return {error:'Could not find header row. Expected columns: Cost, C-Price, L-Price.'};

  const geoHeaderRow=subHeaderRow-1;

  if (geoHeaderRow<0) return {error:'No row above subheader for region names'};



  // Use merge info to map columns to geo names

  const merges=ws['!merges']||[];

  const colToGeo={};

  const geoRow=rows[geoHeaderRow]||[];



  // From merges: cells that span geoHeaderRow

  for (const merge of merges) {

    if (merge.s.r===geoHeaderRow&&merge.e.r===geoHeaderRow) {

      const cellAddr=XLSX.utils.encode_cell({r:merge.s.r, c:merge.s.c});

      const val=ws[cellAddr]?.v;

      if (val) for (let c=merge.s.c;c<=merge.e.c;c++) colToGeo[c]=String(val).trim();

    }

  }

  // Non-merged geo cells

  geoRow.forEach((v,c)=>{ if(v&&!colToGeo[c]) colToGeo[c]=String(v).trim(); });



  // Map subheader columns to roles

  const subRow=rows[subHeaderRow]||[];

  const colToRole={};

  for (let c=5;c<subRow.length;c++) {

    const h=String(subRow[c]||'').toLowerCase().trim();

    if (h==='cost'||h.includes('sales cost')) colToRole[c]='sales_cost';

    else if (h.includes('c-price')||h.includes('channel')) colToRole[c]='channel_price';

    else if (h.includes('l-price')||h.includes('list')) colToRole[c]='list_price';

  }



  const dataStart=subHeaderRow+1;

  const result=[];

  const warnings=[];

  const tiersFound=new Set();



  for (let i=dataStart;i<rows.length;i++) {

    const row=rows[i]||[];

    if (row.every(c=>c==null||c==='')) continue;

    const partNumber=safeStr(row[0]);

    if (!partNumber) continue;

    const tier=safeStr(row[1]);

    const baseWarranty=safeStr(row[2]);

    const upgradeDesc=safeStr(row[3]);

    const deliveryType=safeStr(row[4]);

    // Add-on flags (cols 5-11, present in Stage 3 v2+ export)

    const includedAdp=safeStr(row[5]);

    const includedKyd=safeStr(row[6]);

    const includedSbty=safeStr(row[7]);

    const includedTicru=safeStr(row[8]);

    const includedPremier=safeStr(row[9]);

    const upgFromType=safeStr(row[10]);

    const upgFromTerm=safeStr(row[11]);

    // Extract upgrade_years from description (e.g. "3Y Onsite NBD" → 3)

    const yearsMatch=(upgradeDesc||'').match(/(\d+)\s*[Yy]/);

    const upgradeYears=yearsMatch?parseInt(yearsMatch[1]):null;

    if (tier) tiersFound.add(tier);



    const prices={};

    for (let c=5;c<row.length;c++) {

      const geo=colToGeo[c]; const role=colToRole[c];

      if (!geo||!role) continue;

      if (!prices[geo]) prices[geo]={};

      const raw=String(row[c]||'').replace(/[$,\s]/g,'');

      prices[geo][role]=safeFloat(raw);

    }

    result.push({part_number:partNumber, tier, base_warranty:baseWarranty,

      upgrade_description:upgradeDesc, delivery_type:deliveryType,

      upgrade_years:upgradeYears,

      included_adp:includedAdp, included_kyd:includedKyd, included_sbty:includedSbty,

      included_ticru:includedTicru, included_premier:includedPremier,

      upgrade_from_type:upgFromType, upgrade_from_term:upgFromTerm,

      prices});

  }



  const allRegions=[...new Set(result.flatMap(r=>Object.keys(r.prices)))].filter(Boolean);

  return {rows:result, tiers:[...tiersFound], regions:allRegions, warnings};

}

async function runAllGVE(cycleId) {
  const flatData = await loadCyclePrices(cycleId);
  if (!flatData.length) return [{layer:1, severity:'Warning', violation_type:'NO_DATA', message:'No SKU data found for this cycle.', region:null, tier:null, upgrade_years:null, part_number:null}];

  const tierSeq = await db.tier_sequence.orderBy('sort_order').toArray();
  const s = await getSettings();

  const engine = new GVE.Engine({
    settings: {
      ratio_band_3yr_1yr_min: String(s.ratio_band_3yr_1yr_min || 1.8),
      ratio_band_3yr_1yr_max: String(s.ratio_band_3yr_1yr_max || 2.8),
      ratio_band_5yr_3yr_min: String(s.ratio_band_5yr_3yr_min || 1.3),
      ratio_band_5yr_3yr_max: String(s.ratio_band_5yr_3yr_max || 1.7),
      ratio_band_4yr_2yr_min: String(s.ratio_band_4yr_2yr_min || 1.3),
      ratio_band_4yr_2yr_max: String(s.ratio_band_4yr_2yr_max || 2.0),
      cross_geo_deviation_pct: String(s.cross_geo_deviation_pct || 0.20),
      yoy_cell_change_pct: String(s.yoy_cell_change_pct || 0.25),
      yoy_geo_avg_change_pct: String(s.yoy_geo_avg_change_pct || 0.20),
    },
    tierSequence: tierSeq,
  });

  const baseline = await db.prior_baseline.where('cycle_id').equals(cycleId).toArray();
  const violations = engine.validate(flatData, { 
    valueField: 'sales_cost',
    baseline: baseline.length ? baseline : null,
  });
  
  // Log audit
  const critCount = violations.filter(v => v.severity === 'Critical').length;
  const warnCount = violations.filter(v => v.severity !== 'Critical').length;
  Audit.log.gveRun(critCount, warnCount, currentUser, 4);
  lastGVEResults = violations;
  
  // Run cross-check as well
  try {
    var ccRules = loadCCRules();
    var ccData = violations.map(function(v) { return v; }); // Use GVE data format  
    // Actually use the flat data for cross-check
    lastCCResults = CrossCheck.executeAllWithGeo(ccRules, flatData);
  } catch(e) { console.error('Cross-check error:', e); }

  return violations;
}

// ── CROSS-CHECK ENGINE ─────────────────────────────────────────────────────────
// Rule-based monotonicity validation. Groups data by configurable factors,
// compares by priority, returns PASS/FAIL per pair.
// Design reference: Sales Cost Cross Check App (checkLogic.ts)

var CrossCheck = {};

CrossCheck.FIELDS = {
  service_tier:    function(r) { return r.service_tier || r.tier || ''; },
  country:         function(r) { return r.country || r.region || ''; },
  geo:             function(r) { return r.geo || r.region || ''; },
  delivery_type:   function(r) { return r.delivery_type || ''; },
  upgrade_years:   function(r) { return String(r.upgrade_years || ''); },
  type_of_service: function(r) { return r.type_of_service || ''; },
};

CrossCheck.getGroupKey = function(record, factors) {
  var parts = [];
  for (var i = 0; i < factors.length; i++) {
    var fn = CrossCheck.FIELDS[factors[i]];
    if (fn) parts.push(fn(record));
  }
  return parts.join(' | ');
};

CrossCheck.getCompareValue = function(record, factor) {
  var fn = CrossCheck.FIELDS[factor];
  return fn ? fn(record) : '';
};

CrossCheck.executeRule = function(rule, data) {
  var results = [], groups = {};
  for (var i = 0; i < data.length; i++) {
    var gk = CrossCheck.getGroupKey(data[i], rule.groupingFactors);
    if (!groups[gk]) groups[gk] = [];
    groups[gk].push(data[i]);
  }
  for (var gk in groups) {
    var grp = groups[gk];
    var filtered = grp.filter(function(r) {
      return rule.comparePriority.indexOf(CrossCheck.getCompareValue(r, rule.compareFactor)) !== -1;
    });
    if (filtered.length < 2) continue;
    var buckets = {};
    for (var j = 0; j < filtered.length; j++) {
      var cv = CrossCheck.getCompareValue(filtered[j], rule.compareFactor);
      if (!buckets[cv]) buckets[cv] = [];
      buckets[cv].push(filtered[j]);
    }
    for (var lo = 0; lo < rule.comparePriority.length; lo++) {
      var loVal = rule.comparePriority[lo];
      var loItems = buckets[loVal] || [];
      for (var hi = lo + 1; hi < rule.comparePriority.length; hi++) {
        var hiVal = rule.comparePriority[hi];
        var hiItems = buckets[hiVal] || [];
        for (var li = 0; li < loItems.length; li++) {
          for (var hi_i = 0; hi_i < hiItems.length; hi_i++) {
            var loV = Number(loItems[li][rule.valueField]) || 0;
            var hiV = Number(hiItems[hi_i][rule.valueField]) || 0;
            var status = hiV >= loV ? 'PASS' : 'FAIL';
            results.push({
              ruleId: rule.id, ruleDesc: rule.description, groupKey: gk,
              compareFactor: rule.compareFactor, loPriority: loVal,
              hiPriority: hiVal, loValue: loV, hiValue: hiV,
              status: status, difference: hiV - loV,
              failReason: status === 'FAIL' ? hiVal + ' must be >= ' + loVal + ' (diff: ' + (hiV-loV).toFixed(2) + ')' : null
            });
          }
        }
      }
    }
  }
  return results;
};

CrossCheck.executeAll = function(rules, data) {
  var all = [];
  var released = rules.filter(function(r) { return r.status === 'Released'; });
  for (var i = 0; i < released.length; i++) {
    all = all.concat(CrossCheck.executeRule(released[i], data));
  }
  var p = all.filter(function(r) { return r.status === 'PASS'; }).length;
  var f = all.filter(function(r) { return r.status === 'FAIL'; }).length;
  var gs = {};
  all.forEach(function(r) { gs[r.groupKey] = 1; });
  return { results: all, summary: { totalRules: released.length, totalChecks: all.length,
    passCount: p, failCount: f, totalGroups: Object.keys(gs).length } };
};

// ── CROSS-CHECK ANALYSIS ──────────────────────────────────────────────────────
// Missing Coverage detection + Grouped Summary / Drill-down

CrossCheck.findMissing = function(rules, data) {
  var covered = {};
  var released = rules.filter(function(r) { return r.status === 'Released'; });
  for (var i = 0; i < released.length; i++) {
    var rr = CrossCheck.executeRule(released[i], data);
    for (var j = 0; j < rr.length; j++) {
      for (var k = 0; k < data.length; k++) {
        var gk = CrossCheck.getGroupKey(data[k], released[i].groupingFactors);
        if (gk === rr[j].groupKey) {
          var cv = CrossCheck.getCompareValue(data[k], released[i].compareFactor);
          if (released[i].comparePriority.indexOf(cv) !== -1) {
            var key = data[k].part_number + '|' + gk;
            covered[key] = true;
          }
        }
      }
    }
  }
  return data.filter(function(d) {
    // A record is "missing" if it wasn't covered by any rule
    for (var i = 0; i < released.length; i++) {
      var gk = CrossCheck.getGroupKey(d, released[i].groupingFactors);
      var cv = CrossCheck.getCompareValue(d, released[i].compareFactor);
      if (released[i].comparePriority.indexOf(cv) !== -1) return false;
    }
    return released.length > 0;
  });
};

CrossCheck.buildGroupedSummary = function(results) {
  var groups = {};
  for (var i = 0; i < results.length; i++) {
    var key = results[i].ruleId + '::' + results[i].groupKey;
    if (!groups[key]) {
      groups[key] = {
        ruleId: results[i].ruleId, ruleDesc: results[i].ruleDesc,
        groupKey: results[i].groupKey,
        records: [], hasFail: false, errorCount: 0, totalCount: 0
      };
    }
    groups[key].records.push(results[i]);
    groups[key].totalCount++;
    if (results[i].status === 'FAIL') { groups[key].hasFail = true; groups[key].errorCount++; }
  }
  var list = [];
  for (var k in groups) list.push(groups[k]);
  return list;
};

CrossCheck.buildDrilldown = function(results, ruleId) {
  return {
    byRule: results.filter(function(r) { return r.ruleId === ruleId; }),
    groups: (function() {
      var g = {};
      results.filter(function(r) { return r.ruleId === ruleId; }).forEach(function(r) {
        if (!g[r.groupKey]) g[r.groupKey] = [];
        g[r.groupKey].push(r);
      });
      return g;
    })()
  };
};

// ── D7: Cross-check GEO filter ────────────────────────────────────────────────

CrossCheck.executeAllWithGeo = function(rules, data) {
  var all = [];
  var released = rules.filter(function(r) { return r.status === 'Released'; });
  for (var i = 0; i < released.length; i++) {
    var rule = released[i];
    // If rule has geo filter, only run on matching data
    var filteredData = data;
    if (rule.geo && rule.geo.length) {
      filteredData = data.filter(function(d) {
        return rule.geo.indexOf(d.region || d.geo || '') !== -1;
      });
    }
    if (filteredData.length) {
      all = all.concat(CrossCheck.executeRule(rule, filteredData));
    }
  }
  var p = all.filter(function(r) { return r.status === 'PASS'; }).length;
  var f = all.filter(function(r) { return r.status === 'FAIL'; }).length;
  var gs = {};
  all.forEach(function(r) { gs[r.groupKey] = 1; });
  return { results: all, summary: { totalRules: released.length, totalChecks: all.length,
    passCount: p, failCount: f, totalGroups: Object.keys(gs).length } };
};

function saveCCRule(editId) {
  var desc = document.getElementById('ccr-desc').value.trim();
  var priorityRaw = document.getElementById('ccr-priority').value.trim();
  var cf = document.getElementById('ccr-cf').value;
  var status = document.getElementById('ccr-status').value;
  
  // Get selected grouping factors
  var gfs = [];
  var cbs = document.querySelectorAll('#ccr-cf').length ? [] : [];
  // Actually get from checkboxes
  var allCbs = document.querySelectorAll('.form-group input[type=checkbox]');
  allCbs.forEach(function(cb) { if (cb.checked) gfs.push(cb.value); });
  
  if (!desc) { toast('Description required', 'error'); return; }
  if (!gfs.length) { toast('Select at least one grouping factor', 'error'); return; }
  
  var priority = priorityRaw.split('\n').map(function(s) { return s.trim(); }).filter(Boolean);
  if (priority.length < 2) { toast('Need at least 2 priority values', 'error'); return; }
  
  var rules = loadCCRules();
  if (editId) {
    for (var i = 0; i < rules.length; i++) {
      if (rules[i].id === editId) {
        rules[i].description = desc;
        rules[i].groupingFactors = gfs;
        rules[i].compareFactor = cf;
        rules[i].comparePriority = priority;
        rules[i].status = status;
        if (status === 'Released') {
          // Retire other rules with same compareFactor
          for (var j = 0; j < rules.length; j++) {
            if (j !== i && rules[j].compareFactor === cf && rules[j].status === 'Released') {
              rules[j].status = 'Retired';
            }
          }
        }
        break;
      }
    }
  } else {
    rules.push({
      id: 'CC_' + Date.now(),
      description: desc,
      groupingFactors: gfs,
      compareFactor: cf,
      comparePriority: priority,
      status: status,
      valueField: 'sales_cost'
    });
  }
  saveCCRules(rules);
  UI.hideModal();
  toast('Rule saved', 'success');
}

function deleteCCRule(id) {
  var rules = loadCCRules();
  saveCCRules(rules.filter(function(r) { return r.id !== id; }));
  toast('Rule deleted', 'success');
}


function duplicateCCRule(id) {
  var rules = loadCCRules();
  var src = rules.find(function(r) { return r.id === id; });
  if (!src) { toast('Rule not found','error'); return; }
  var dup = Object.assign({}, src);
  dup.id = 'CC_' + Date.now();
  dup.description = (dup.description||'') + ' (Copy)';
  dup.status = 'Draft';
  rules.push(dup);
  saveCCRules(rules);
  UI.hideModal();
  toast('Rule duplicated as Draft','success');
  showCCRuleManager();
}

function showCCRuleManager() {
  var rules = loadCCRules();
  var h = '<div style="max-height:65vh;overflow-y:auto">';
  h += '<h3 style="margin:0 0 12px 0">Cross-Check Rules</h3>';
  h += '<table class="tbl"><thead><tr><th>ID</th><th>Compare</th><th>Priority</th><th>Status</th><th></th></tr></thead><tbody>';
  rules.forEach(function(r) {
    var sc = r.status === 'Released' ? 'color:#065f46' : r.status === 'Draft' ? 'color:#d97706' : 'color:#ABA8B1';
    h += '<tr><td style="font-size:12px">' + r.id + '<br><span style="font-size:11px;color:#ABA8B1">' + (r.description||'').slice(0,60) + '</span></td>';
    h += '<td>' + r.compareFactor + '</td>';
    h += '<td style="font-size:11px">' + r.comparePriority.join(' → ') + '</td>';
    h += '<td style="' + sc + '">' + r.status + '</td>';
    h += '<td><button onclick="showCCRuleDesigner(\'' + r.id + '\')" style="font-size:11px">Edit</button></td></tr>';
  });
  h += '</tbody></table>';
  h += '<button onclick="showCCRuleDesigner(null)" style="margin-top:8px">+ New Rule</button>';
  h += '</div>';
  UI.showModal('Cross-Check Rules', h, '', true);
}

async function sendToStage5() {
  const flatData = await loadCyclePrices(currentCycleId);
  if (!flatData.length) { toast('No data to send', 'error'); return; }

  // Transform to Stage 5 expected format (part_number, tier, upgrade_years, delivery_type, region, sales_cost)
  const stage5Data = flatData.map(r => ({
    part_number:     r.part_number,
    tier:            r.tier,
    upgrade_years:   r.upgrade_years,
    delivery_type:   r.delivery_type,
    region:          r.region,
    sales_cost:      r.sales_cost,
    included_adp:    r.included_adp || '',
    included_kyd:    r.included_kyd || '',
    included_sbty:   r.included_sbty || '',
    included_ticru:  r.included_ticru || '',
    included_premier: r.included_premier || '',
    upgrade_from_type: r.upgrade_from_type || '',
    upgrade_from_term: r.upgrade_from_term || '',
  }));

  const result = Bridge.saveForNext(4, stage5Data, {
    cycleName: (await db.cycles.get(currentCycleId))?.name || 'Unknown',
    stage: 4,
  });

  if (result.success) {
    toast(`Sent ${result.rowCount} SKUs to Stage 5 via Bridge`, 'success');
    Audit.log.bridgeSend(5, result.rowCount, currentUser, 4);
  } else {
    toast('Bridge error: ' + result.error, 'error');
  }
}

async function exportCSV() {

  const allPrices=await loadCyclePrices(currentCycleId);

  if (!allPrices.length) { toast('No data to export','error'); return; }

  const headers=['Part Number','Tier','Base Warranty','Upgrade','Delivery Type','Upgrade Years',

    'ADP','KYD','SBTY','TI CRU','Premier','Upgrade From Type','Upgrade From Term',

    'Region','Sales Cost'];

  const rows=[headers.join(',')];

  for (const r of allPrices) {

    rows.push([r.part_number,r.tier,r.base_warranty,r.upgrade_description,r.delivery_type,

      r.upgrade_years??'',

      r.included_adp??'',r.included_kyd??'',r.included_sbty??'',r.included_ticru??'',r.included_premier??'',

      r.upgrade_from_type??'',r.upgrade_from_term??'',

      r.region,r.sales_cost??'',

    ].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','));

  }

  downloadFile(rows.join('\n'), 'gve_results.csv', 'text/csv');

  toast('CSV downloaded','success');

}

function downloadFile(content, filename, mime) {

  const a=document.createElement('a');

  a.href=URL.createObjectURL(new Blob([content],{type:mime}));

  a.download=filename; a.click();

  setTimeout(()=>URL.revokeObjectURL(a.href),1000);

}

  app().innerHTML=`<div style="padding:40px;text-align:center;color:#991b1b">

    <p style="margin-top:8px;font-size:13px;color:#6F7170">Use Chrome or Edge &nbsp;·&nbsp; Open as a local file (not a network drive) &nbsp;·&nbsp; Allow local file access if prompted</p>

  </div>`;

}



document.addEventListener('DOMContentLoaded', async () => {

  console.log('[GPS4] DOMContentLoaded fired');

  document.getElementById('_err').textContent = 'DOMContentLoaded — opening database…';

  // Timeout guard: if initDB hangs for >6 s, surface a diagnostic message

  let dbDone = false;

  const timer = setTimeout(() => {

    if (!dbDone) showFatal('Database timed out',

      'IndexedDB did not respond within 6 seconds.\n\nPossible causes:\n' +

      '  • File opened from a network / UNC path (\\\\server\\share\\...)\n' +

      '  • Browser blocking IndexedDB for file:// pages\n' +

      '  • Another tab has this database open in a broken state\n\n' +

      'Try: open in Chrome or Edge → address bar should start with  file:///C:/...');

  }, 6000);



  try {

    await initDB();

    dbDone = true;

    clearTimeout(timer);

  } catch(e) {

    dbDone = true;

    clearTimeout(timer);

    showFatal('Failed to initialise database',

      (e.name ? e.name + ': ' : '') + e.message + (e.stack ? '\n\n' + e.stack : ''));

    return;

  }

  currentUser=localStorage.getItem('gps_user');

  window.addEventListener('hashchange', route);

  try {

    await route();

  } catch(e) {

    showFatal('Error rendering page', (e.name?e.name+': ':'')+e.message+(e.stack?'\n\n'+e.stack:''));

  }

});
