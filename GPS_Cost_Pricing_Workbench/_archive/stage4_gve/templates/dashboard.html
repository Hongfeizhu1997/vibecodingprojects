{% extends "base.html" %}
{% block title %}Dashboard — GPS Pricing Workbench{% endblock %}

{% block content %}
<div class="flex-between" style="margin-bottom:20px">
  <div class="page-title" style="margin:0">Pricing Cycles</div>
  <button class="btn btn-primary" onclick="showNewCycleModal()">+ New Cycle</button>
</div>

<div class="card" id="cyclesCard">
  <div id="cyclesBody"><div class="spinner"></div> Loading…</div>
</div>

<script>
async function loadCycles() {
  const r = await fetch("/api/cycles");
  const cycles = await r.json();
  const el = document.getElementById("cyclesBody");

  if (!cycles.length) {
    el.innerHTML = '<p class="text-muted">No pricing cycles yet. Click <b>+ New Cycle</b> to get started.</p>';
    return;
  }

  let html = `<table>
    <tr>
      <th>Cycle Name</th><th>Fiscal Year</th><th>Status</th>
      <th>Created By</th><th>Created</th><th>Submitted</th><th></th>
    </tr>`;
  cycles.forEach(c => {
    const created = c.created_at ? c.created_at.slice(0,16) : "";
    const submitted = c.submitted_at ? c.submitted_at.slice(0,16) : "—";
    html += `<tr>
      <td><a href="/cycle/${c.id}">${c.name}</a></td>
      <td>${c.fiscal_year}</td>
      <td>${sev(c.status)}</td>
      <td>${c.created_by}</td>
      <td>${created}</td>
      <td>${submitted}</td>
      <td><a href="/cycle/${c.id}" class="btn btn-outline btn-sm">Open</a></td>
    </tr>`;
  });
  html += "</table>";
  el.innerHTML = html;
}

function showNewCycleModal() {
  modal.show("Create New Pricing Cycle",
    `<div class="form-group">
       <label>Cycle Name</label>
       <input type="text" id="newName" placeholder="e.g. FY2026 EMEA ThinkNB">
     </div>
     <div class="form-group">
       <label>Fiscal Year</label>
       <input type="text" id="newFY" placeholder="e.g. FY2026">
     </div>`,
    [
      { label: "Cancel", cls: "btn-outline", onclick: () => modal.close() },
      { label: "Create", cls: "btn-primary", onclick: createCycle },
    ]
  );
  setTimeout(() => document.getElementById("newName").focus(), 50);
}

async function createCycle() {
  const name = document.getElementById("newName").value.trim();
  const fy = document.getElementById("newFY").value.trim();
  if (!name || !fy) { alert("Please fill in both fields."); return; }
  const r = await api("POST", "/api/cycles", { name, fiscal_year: fy });
  const data = await r.json();
  modal.close();
  if (data.id) window.location = `/cycle/${data.id}`;
  else loadCycles();
}

loadCycles();
</script>
{% endblock %}
