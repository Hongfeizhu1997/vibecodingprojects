<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GPS Pricing Workbench — Sign In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", Arial, sans-serif; background: #f0f2f5;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 16px rgba(0,0,0,.1);
            padding: 40px 36px; width: 380px; }
    .brand { font-size: 1.3em; font-weight: 700; color: #1a2438; margin-bottom: 6px; }
    .brand span { color: #4ea8de; }
    .subtitle { color: #6c757d; font-size: .9em; margin-bottom: 28px; }
    label { display: block; font-size: .875em; font-weight: 500; margin-bottom: 6px; color: #495057; }
    input { width: 100%; padding: 10px 14px; border: 1px solid #dee2e6; border-radius: 8px;
            font-size: .95em; outline: none; font-family: inherit; }
    input:focus { border-color: #0d6efd; box-shadow: 0 0 0 3px rgba(13,110,253,.15); }
    button { width: 100%; padding: 11px; background: #0d6efd; color: #fff; border: none;
             border-radius: 8px; font-size: 1em; font-weight: 600; cursor: pointer; margin-top: 18px; }
    button:hover { background: #0b5ed7; }
    .error { background: #f8d7da; color: #842029; border-radius: 6px;
             padding: 10px 14px; font-size: .875em; margin-bottom: 16px; }
  </style>
</head>
<body>
<div class="card">
  <div class="brand">GPS Pricing <span>Workbench</span></div>
  <div class="subtitle">Global Product Support — Service Pricing Tool</div>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <div>
      <label for="username">Your name</label>
      <input type="text" id="username" name="username" placeholder="e.g. Jane Smith" autofocus required>
    </div>
    <button type="submit">Sign In</button>
  </form>
</div>
</body>
</html>
