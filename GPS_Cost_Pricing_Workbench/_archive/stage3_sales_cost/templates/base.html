<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}GPS Pricing — Stage 3{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", Arial, sans-serif; background: #f0f2f5; color: #212529; min-height: 100vh; }
    a { color: #0d6efd; text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Nav */
    nav { background: #1a2438; color: #fff; display: flex; align-items: center;
          padding: 0 24px; height: 52px; gap: 32px; }
    nav .brand { font-size: 1.05em; font-weight: 700; color: #fff; letter-spacing: .5px; }
    nav .brand span { color: #4ea8de; }
    nav a { color: #adb5bd; font-size: .9em; }
    nav a:hover { color: #fff; text-decoration: none; }
    nav .spacer { flex: 1; }
    nav .user { font-size: .85em; color: #6c757d; }
    nav .user a { color: #adb5bd; margin-left: 8px; }

    /* Main layout */
    .container { max-width: 1400px; margin: 0 auto; padding: 28px 24px; }
    .page-title { font-size: 1.4em; font-weight: 700; margin-bottom: 20px; color: #1a2438; }

    /* Cards */
    .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08);
            padding: 20px 24px; margin-bottom: 20px; }
    .card-header { display: flex; align-items: center; justify-content: space-between;
                   margin-bottom: 16px; }
    .card-title { font-size: 1em; font-weight: 600; color: #1a2438; }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 16px;
           border-radius: 6px; border: none; font-size: .875em; font-weight: 500;
           cursor: pointer; transition: filter .15s; }
    .btn:hover { filter: brightness(.92); }
    .btn-primary   { background: #0d6efd; color: #fff; }
    .btn-success   { background: #198754; color: #fff; }
    .btn-danger    { background: #dc3545; color: #fff; }
    .btn-warning   { background: #ffc107; color: #212529; }
    .btn-secondary { background: #6c757d; color: #fff; }
    .btn-outline   { background: transparent; border: 1px solid #dee2e6; color: #495057; }
    .btn-sm { padding: 4px 10px; font-size: .8em; }

    /* Badges */
    .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: .75em;
             font-weight: 600; }
    .badge-critical  { background: #f8d7da; color: #842029; }
    .badge-warning   { background: #fff3cd; color: #664d03; }
    .badge-systemic  { background: #fde8d8; color: #84290e; }
    .badge-ok        { background: #d1e7dd; color: #0a3622; }
    .badge-clear     { background: #d1e7dd; color: #0a3622; }
    .badge-blocked   { background: #f8d7da; color: #842029; }
    .badge-draft     { background: #e2e3e5; color: #41464b; }
    .badge-submitted { background: #cfe2ff; color: #084298; }
    .badge-released  { background: #d1e7dd; color: #0a3622; }
    .badge-retired   { background: #e2e3e5; color: #41464b; }

    /* Factor classification badges */
    .badge-cls-territory     { background: #cfe2ff; color: #084298; }
    .badge-cls-hardware      { background: #d1e7dd; color: #0a3622; }
    .badge-cls-service-type  { background: #e8d5f5; color: #5a1a8a; }
    .badge-cls-service-period{ background: #ffe5d0; color: #7c3410; }
    .badge-cls-sla           { background: #fff3cd; color: #664d03; }
    .badge-cls-service-scope { background: #e2e3e5; color: #41464b; }

    /* Tables */
    table { width: 100%; border-collapse: collapse; font-size: .875em; }
    th { background: #f8f9fa; padding: 10px 12px; text-align: left; font-weight: 600;
         color: #495057; border-bottom: 2px solid #dee2e6; white-space: nowrap; }
    td { padding: 9px 12px; border-bottom: 1px solid #f0f2f5; vertical-align: middle; }
    tr:hover td { background: #f8f9fa; }

    /* Forms */
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: .875em; font-weight: 500; margin-bottom: 5px; color: #495057; }
    input[type=text], input[type=number], input[type=date], select, textarea {
      width: 100%; padding: 8px 12px; border: 1px solid #dee2e6; border-radius: 6px;
      font-size: .875em; font-family: inherit; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: #0d6efd; box-shadow: 0 0 0 3px rgba(13,110,253,.15); }
    textarea { resize: vertical; min-height: 80px; }

    /* Tabs */
    .tabs { display: flex; gap: 0; border-bottom: 2px solid #dee2e6; margin-bottom: 20px; flex-wrap: wrap; }
    .tab  { padding: 8px 18px; font-size: .875em; cursor: pointer; border-bottom: 2px solid transparent;
            margin-bottom: -2px; color: #6c757d; transition: color .15s; }
    .tab:hover { color: #0d6efd; }
    .tab.active { color: #0d6efd; border-bottom-color: #0d6efd; font-weight: 600; }

    /* Sub-tabs */
    .sub-tabs { display: flex; gap: 4px; margin-bottom: 16px; }
    .sub-tab { padding: 5px 14px; font-size: .82em; cursor: pointer; border-radius: 20px;
               background: #f0f2f5; color: #6c757d; border: 1px solid #dee2e6; }
    .sub-tab:hover { background: #e2e6ea; }
    .sub-tab.active { background: #0d6efd; color: #fff; border-color: #0d6efd; }

    /* Alert */
    .alert { padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; font-size: .875em; }
    .alert-danger  { background: #f8d7da; color: #842029; border: 1px solid #f5c2c7; }
    .alert-success { background: #d1e7dd; color: #0a3622; border: 1px solid #badbcc; }
    .alert-warning { background: #fff3cd; color: #664d03; border: 1px solid #ffecb5; }
    .alert-info    { background: #cff4fc; color: #055160; border: 1px solid #b6effb; }

    /* Spinner */
    .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid #dee2e6;
               border-top-color: #0d6efd; border-radius: 50%; animation: spin .6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45);
                     z-index: 1000; align-items: center; justify-content: center; }
    .modal-overlay.show { display: flex; }
    .modal { background: #fff; border-radius: 10px; padding: 28px; width: 500px; max-width: 95vw;
             box-shadow: 0 8px 32px rgba(0,0,0,.18); max-height: 90vh; overflow-y: auto; }
    .modal h3 { margin-bottom: 16px; font-size: 1.1em; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    .modal-wide { width: 780px; }

    /* Two-panel factor selector */
    .factor-selector { display: flex; gap: 12px; align-items: flex-start; }
    .factor-panel { flex: 1; border: 1px solid #dee2e6; border-radius: 6px; min-height: 200px;
                    max-height: 280px; overflow-y: auto; }
    .factor-panel-header { background: #f8f9fa; padding: 8px 12px; font-size: .8em;
                           font-weight: 600; color: #495057; border-bottom: 1px solid #dee2e6; }
    .factor-item { padding: 7px 12px; cursor: pointer; font-size: .82em; display: flex;
                   align-items: center; justify-content: space-between; border-bottom: 1px solid #f0f2f5; }
    .factor-item:last-child { border-bottom: none; }
    .factor-item:hover { background: #e8f4fd; }
    .factor-item.selected { background: #cfe2ff; }

    /* Result table cell colors */
    .cell-calculated { background: #d1e7dd; }
    .cell-no-rule    { background: #fff3cd; }
    .cell-no-psc     { background: #e2e3e5; color: #6c757d; }

    /* Grid helpers */
    .flex { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .mt-1 { margin-top: 8px; }
    .mt-2 { margin-top: 16px; }
    .text-muted { color: #6c757d; font-size: .85em; }
    .section-title { font-size: .95em; font-weight: 600; color: #1a2438; margin-bottom: 12px; margin-top: 4px; }
    hr.section-sep { border: none; border-top: 1px solid #dee2e6; margin: 20px 0; }

    /* Drop zone */
    .drop-zone { border: 2px dashed #dee2e6; border-radius: 8px; padding: 32px; text-align: center;
                 cursor: pointer; transition: border-color .2s, background .2s; }
    .drop-zone:hover, .drop-zone.dragover { border-color: #0d6efd; background: #f0f7ff; }
    .drop-zone p { color: #6c757d; font-size: .9em; margin-bottom: 10px; }

    /* Pagination */
    .pagination { display: flex; gap: 6px; align-items: center; margin-top: 12px; }
    .page-btn { padding: 4px 10px; border: 1px solid #dee2e6; border-radius: 4px; font-size: .8em;
                cursor: pointer; background: #fff; color: #495057; }
    .page-btn:hover { background: #f0f2f5; }
    .page-btn.active { background: #0d6efd; color: #fff; border-color: #0d6efd; }
    .page-btn:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
<nav>
  <span class="brand">GPS Pricing <span>Stage 3</span></span>
  <a href="/">Dashboard</a>
  <a href="/catalogs">Catalogs</a>
  <a href="/rules">Rules</a>
  <span class="spacer"></span>
  <span class="user">{{ username }} <a href="/logout">Sign out</a></span>
</nav>
<div class="container">
  {% block content %}{% endblock %}
</div>

<div class="modal-overlay" id="globalModal">
  <div class="modal" id="globalModalBox">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script>
const modal = {
  el: document.getElementById("globalModal"),
  box: document.getElementById("globalModalBox"),
  show(title, body, actions, wide) {
    document.getElementById("modalTitle").textContent = title;
    document.getElementById("modalBody").innerHTML = body;
    const act = document.getElementById("modalActions");
    act.innerHTML = "";
    (actions || []).forEach(a => {
      const b = document.createElement("button");
      b.className = "btn " + (a.cls || "btn-primary");
      b.textContent = a.label;
      b.onclick = a.onclick;
      act.appendChild(b);
    });
    if (wide) this.box.classList.add("modal-wide");
    else this.box.classList.remove("modal-wide");
    this.el.classList.add("show");
  },
  close() { this.el.classList.remove("show"); }
};
document.getElementById("globalModal").addEventListener("click", e => {
  if (e.target === e.currentTarget) modal.close();
});

async function api(method, url, body) {
  const opts = { method, headers: {} };
  if (body) { opts.body = JSON.stringify(body); opts.headers["Content-Type"] = "application/json"; }
  const r = await fetch(url, opts);
  return r;
}

function statusBadge(s) {
  const map = {
    Draft: "badge-draft", Released: "badge-released", Retired: "badge-retired",
    draft: "badge-draft", submitted: "badge-submitted",
    Critical: "badge-critical", Warning: "badge-warning",
    Systemic: "badge-systemic", OK: "badge-ok", Clear: "badge-clear",
    Blocked: "badge-blocked",
  };
  return `<span class="badge ${map[s] || 'badge-ok'}">${s}</span>`;
}

function clsBadge(cls) {
  const map = {
    "Territory": "badge-cls-territory",
    "Hardware": "badge-cls-hardware",
    "Service Type": "badge-cls-service-type",
    "Service Period": "badge-cls-service-period",
    "SLA": "badge-cls-sla",
    "Service Scope": "badge-cls-service-scope",
  };
  return `<span class="badge ${map[cls] || 'badge-draft'}">${cls}</span>`;
}

function fmt(v, decimals=2) {
  if (v === null || v === undefined || v === '') return '—';
  const n = parseFloat(v);
  if (isNaN(n)) return v;
  return n.toLocaleString(undefined, {minimumFractionDigits: decimals, maximumFractionDigits: decimals});
}

function pct(v) {
  if (v === null || v === undefined || v === '') return '—';
  return (parseFloat(v) * 100).toFixed(2) + '%';
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
