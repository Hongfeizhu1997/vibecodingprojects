<style>

*{box-sizing:border-box;margin:0;padding:0}

body{font-family:'Montserrat','Helvetica Neue',Arial,sans-serif;font-size:14px;background:#F4F4F4;color:#1E0013;min-height:100vh}

a{color:#E1251B;text-decoration:none}

/* NAV */

.nav{background:#11184F;color:#fff;display:flex;align-items:center;padding:0 20px;height:56px;gap:20px;position:sticky;top:0;z-index:100}

.nav-brand{font-weight:700;font-size:15px;letter-spacing:.3px;white-space:nowrap;color:#fff;text-decoration:none;cursor:pointer}.nav-brand:hover{opacity:.75}

.nav-links{display:flex;gap:4px;flex:1}

.nav-links a{color:#cbd5e1;padding:6px 12px;border-radius:4px;font-size:13px;cursor:pointer}

.nav-links a:hover,.nav-links a.active{background:rgba(255,255,255,.15);color:#fff}

.nav-user{color:#ABA8B1;font-size:13px;white-space:nowrap}

/* CONTAINER */

.container{max-width:1280px;margin:0 auto;padding:20px}

/* CARD */

.card{background:#fff;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:20px;margin-bottom:16px}

.card-title{font-size:15px;font-weight:600;margin-bottom:14px;color:#000000}

/* BUTTONS */

.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:4px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:background .15s}

.btn-primary{background:#E1251B;color:#fff;border-color:#E1251B}.btn-primary:hover{background:#64131E}

.btn-secondary{background:#fff;color:#374151;border-color:#d1d5db}.btn-secondary:hover{background:#EAEEF5}

.btn-danger{background:#dc2626;color:#fff;border-color:#dc2626}.btn-danger:hover{background:#b91c1c}

.btn-sm{padding:4px 10px;font-size:12px}

.btn:disabled{opacity:.5;cursor:not-allowed}

/* TABLES */

.tbl{width:100%;border-collapse:collapse;font-size:13px}

.tbl th{background:#FAFAFA;text-align:left;padding:8px 10px;font-weight:600;color:#374151;border-bottom:2px solid #e5e7eb;white-space:nowrap}

.tbl td{padding:7px 10px;border-bottom:1px solid #f1f5f9;vertical-align:middle}

.tbl tr:hover td{background:#fafafa}

/* BADGES */

.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;white-space:nowrap}

.badge-draft{background:#fef9c3;color:#854d0e}

.badge-released{background:#ecfdf5;color:#065f46}

.badge-retired{background:#f1f5f9;color:#475569}

.badge-auto{background:#FAECEB;color:#E1251B}

.badge-norule{background:#fee2e2;color:#991b1b}

.badge-territory{background:#e0e7ff;color:#3730a3}

.badge-hardware{background:#fce7f3;color:#9d174d}

.badge-service-type{background:#d1fae5;color:#065f46}

.badge-service-period{background:#fff7ed;color:#9a3412}

.badge-sla{background:#f3e8ff;color:#6b21a8}

.badge-service-scope{background:#ecfdf5;color:#064e3b}

/* AIPC badge */
.aipc-badge{display:inline-block;padding:3px 10px;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s}
.aipc-yes{background:#d1fae5;color:#065f46;border:1px solid #6ee7b7}

.aipc-no{background:#f1f5f9;color:#64748b;border:1px solid #cbd5e1}

/* FORMS */

.form-row{display:grid;gap:12px;margin-bottom:12px}

.form-row-2{grid-template-columns:1fr 1fr}

.form-group{display:flex;flex-direction:column;gap:4px}

/* TABS */

.tabs{display:flex;gap:0;border-bottom:2px solid #e5e7eb;margin-bottom:20px}

.tab{padding:10px 18px;font-size:13px;font-weight:500;color:#6F7170;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:color .15s}

.modal-body{padding:20px;overflow-y:auto;flex:1}

.modal-footer{padding:12px 20px;border-top:1px solid #e5e7eb;display:flex;justify-content:flex-end;gap:8px}

.toast{padding:10px 16px;border-radius:6px;font-size:13px;font-weight:500;box-shadow:0 4px 12px rgba(0,0,0,.15);animation:slideIn .2s ease}

.toast-success{background:#166534;color:#fff}

.toast-error{background:#991b1b;color:#fff}

/* FACTOR SELECTOR */

.factor-selector{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}

.factor-panel{border:1px solid #d1d5db;border-radius:4px;overflow:hidden}

.factor-panel-title{background:#FAFAFA;padding:7px 10px;font-size:12px;font-weight:600;color:#374151;border-bottom:1px solid #e5e7eb}

.factor-list{min-height:140px;max-height:220px;overflow-y:auto;padding:4px}

.factor-item{padding:5px 8px;border-radius:4px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:6px}

.factor-arrows{display:flex;flex-direction:column;gap:6px;justify-content:center;align-items:center;padding:8px}

/* UPLOAD ZONE */

.upload-zone{border:2px dashed #d1d5db;border-radius:4px;padding:30px;text-align:center;cursor:pointer;transition:border-color .2s}

.upload-zone:hover,.upload-zone.drag-over{border-color:#E1251B;background:#FAECEB}

/* STATS GRID */

.stat-card{background:#fff;border:1px solid #E6E2E4;border-radius:4px;padding:14px;text-align:center}

.stat-card .stat-val{font-size:26px;font-weight:700;color:#000000}

.stat-card .stat-label{font-size:11px;color:#6F7170;margin-top:2px}

/* PAGE HEADER */

.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}

.page-header h1{font-size:20px;font-weight:700;color:#000000}

/* PAGINATION */

.pagination{display:flex;align-items:center;gap:6px;margin-top:12px}

.pagination button{padding:5px 10px;font-size:12px;border:1px solid #d1d5db;background:#fff;border-radius:4px;cursor:pointer}

.pagination button:disabled{opacity:.4;cursor:not-allowed}

/* MISC */

.hidden{display:none!important}

.formula-chip{display:inline-block;background:#FAECEB;color:#E1251B;border-radius:3px;padding:1px 5px;font-size:11px;margin:1px}

/* LOGIN PAGE */

.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#000000 0%,#E1251B 100%)}

.login-card{background:#fff;border-radius:12px;padding:40px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,.3)}

.login-card h1{font-size:22px;font-weight:700;color:#000000;margin-bottom:4px}

.login-card p{color:#6F7170;font-size:13px;margin-bottom:24px}

.total-uplift-row{background:#f0fdf4;font-weight:600}

.err-item{color:#991b1b;font-size:12px;padding:3px 0}

/* CATALOG-RULE SPLIT */

.cat-rule-split{display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start}

.cat-panel{background:#fff;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden}

.cat-panel-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #e5e7eb;background:#FAFAFA}

.cat-list{overflow-y:auto;max-height:calc(100vh - 220px)}

.cat-item{padding:10px 14px;border-bottom:1px solid #f1f5f9;cursor:pointer;transition:background .12s}

.cat-item:hover{background:#FAFAFA}

.cat-item.cat-active{background:#FAECEB;border-left:3px solid #E1251B}

.cat-item-name{font-weight:600;font-size:13px;color:#000000}

.cat-item-meta{font-size:11px;color:#6F7170;margin-top:2px}

.cat-item-actions{margin-top:6px;display:flex;gap:4px}

.rule-panel{min-width:0}

.rule-panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}

</style>

<script>

'use strict';



// ── CONSTANTS ─────────────────────────────────────────────────────────────────



const FACTOR_DEFINITIONS = [

  {technical_id:'TYPESRV',   factor_name:'Type of Service',            classification:'Service Type'},

  {technical_id:'SUBTYPESRV',factor_name:'Sub-Type of Service',        classification:'Service Type'},

  {technical_id:'GEO',       factor_name:'GEO',                        classification:'Territory'},

  {technical_id:'COUNTRY',   factor_name:'Country',                    classification:'Territory'},

  {technical_id:'SRVTIER',   factor_name:'Service Tier',               classification:'Hardware'},

  {technical_id:'SUBSRVTIER',factor_name:'Sub Service Tier',           classification:'Hardware'},

  {technical_id:'MT',        factor_name:'Compatible MT',              classification:'Hardware'},

  {technical_id:'SRVTERM',   factor_name:'Service Term',               classification:'Service Period'},

  {technical_id:'UPGFRMTERM',factor_name:'Upgrade From Term',          classification:'Service Period'},

  {technical_id:'UPGFRMTYPE',factor_name:'Upgrade From Type',          classification:'Service Scope'},

  {technical_id:'SABTIME',   factor_name:'Service Availability Time',  classification:'SLA'},

  {technical_id:'RSPTIME',   factor_name:'Service Response Time',      classification:'SLA'},

  {technical_id:'SDTYPE',    factor_name:'Service Delivery Type',      classification:'Service Scope'},

  {technical_id:'ICPS',      factor_name:'Included Premier Service',   classification:'Service Scope'},

  {technical_id:'PSTYPE',    factor_name:'Premier Service Type',       classification:'Service Scope'},

  {technical_id:'ICADP',     factor_name:'Included ADP or ADI Service',classification:'Service Scope'},

  {technical_id:'ICKYD',     factor_name:'Included KYD Service',       classification:'Service Scope'},

  {technical_id:'ICSBTY',    factor_name:'Included SBTY Service',      classification:'Service Scope'},

  {technical_id:'ICISE',     factor_name:'Included ISE Service',       classification:'Service Scope'},

  {technical_id:'ICTICRU',   factor_name:'Included TI CRU Service',    classification:'Service Scope'},
  {technical_id:'AIPC',      factor_name:'AIPC',                       classification:'Hardware'},

];



const FACTOR_FIELD_MAP = {

  TYPESRV:'type_of_service', SUBTYPESRV:'sub_type_of_service', GEO:'geo',

  COUNTRY:'country', SRVTIER:'service_tier', SUBSRVTIER:'sub_service_tier',

  MT:'compatible_mt', SRVTERM:'service_term', UPGFRMTERM:'upgrade_from_term', UPGFRMTYPE:'upgrade_from_type',

  SABTIME:'service_availability_time',

  RSPTIME:'service_response_time', SDTYPE:'service_delivery_type',

  ICPS:'included_premier_service', PSTYPE:'premier_service_type',

  ICADP:'included_adp', ICKYD:'included_kyd', ICSBTY:'included_sbty',

  ICISE:'included_ise', ICTICRU:'included_ticru',
  AIPC:'aipc',

};



const SKU_COLUMN_MAP = {

  'Service PN':'service_pn','Service PN Short Description':'short_description',

  'Service PN Sales& Marketing Description':'sm_description','OH ID':'oh_id',

  'OH Name':'oh_name','Type of Service':'type_of_service',

  'Sub-Type of Service':'sub_type_of_service','Offering Type':'offering_type',

  'Standard Cost ( Base Cost )':'psc_value','Currency':'currency',

  'Sales Cost Source':'sales_cost_source','GEO':'geo','Country':'country',

  'Service Tier':'service_tier','Sub Service Tier':'sub_service_tier',

  'Compatible MT':'compatible_mt','SDF Code':'sdf_code',

  'SDF Code Short Description':'sdf_short_description',

  'SDF Code Long Description':'sdf_long_description','Service Term':'service_term',

  'Unit':'unit','Service Availability Time':'service_availability_time',

  'Service Response Time':'service_response_time',

  'Service Delivery Type':'service_delivery_type',

  'Upgrade From Type':'upgrade_from_type',

  'Upgrade From Term':'upgrade_from_term',
  'AIPC':'aipc',

  'Included Premier Service':'included_premier_service',

  'Premier Service Type':'premier_service_type',

  'Included Protection Service':'included_adp','Included KYD Service':'included_kyd',

  'Included SBTY Service':'included_sbty','Included ISE Service':'included_ise',

  'Included TI CRU Service':'included_ticru',

};

const SKIP_COLUMNS = new Set(['Sales Cost']);

// ── DATA ENRICHMENT ───────────────────────────────────────────────────────────
// Auto-extracts computed fields (pos_or_apos, starting_point, term_label)
// from raw SKU import data. Design reference: Cross Check App dataTransform.ts.

const DataEnrich = {
  classifyPosOrApos: function(desc) {
    if (!desc) return 'POS';
    var u = String(desc).toUpperCase();
    if (u.includes('APOS')) return 'APOS';
    if (u.includes('POST WARRANTY')) return 'APOS';
    if (/\bPW\b/.test(u)) return 'APOS';
    if (/\bPOST\b/.test(u) && (u.includes('WARRANTY') || u.includes('POST SALE'))) return 'APOS';
    return 'POS';
  },

  extractStartingPoint: function(desc, upT, upTerm) {
    if (!desc) return DataEnrich._sp(upT, upTerm);
    var n = String(desc).toLowerCase().replace(/\s+/g, ' ').trim();
    var idx = n.indexOf('upgrade from');
    if (idx === -1) return DataEnrich._sp(upT, upTerm);
    var orig = String(desc);
    var oi = 0, ni = 0, t = idx + 12;
    for (var i = 0; i < orig.length && ni < t; i++) {
      if (orig[i].toLowerCase() === n[ni]) ni++;
      oi = i;
    }
    var after = orig.substring(oi + 1);
    var end = after.length;
    [' for', ' upgrade'].forEach(function(m) {
      var mi = after.toLowerCase().indexOf(m);
      if (mi !== -1 && mi < end) end = mi;
    });
    var ext = after.substring(0, end).trim();
    return ext || DataEnrich._sp(upT, upTerm);
  },

  _sp: function(upT, upTerm) {
    if (!upT) return '';
    var s = String(upT).trim();
    if (upTerm) s += ' ' + String(upTerm).trim();
    return s;
  },

  extractTermLabel: function(shortDesc) {
    if (!shortDesc) return '';
    return String(shortDesc).trim().substring(0, 2);
  },

  enrich: function(sku) {
    var e = {};
    for (var k in sku) Object.prototype.hasOwnProperty.call(sku, k) && (e[k] = sku[k]);
    e.pos_or_apos = DataEnrich.classifyPosOrApos(sku.sm_description);
    e.starting_point = DataEnrich.extractStartingPoint(sku.sm_description, sku.upgrade_from_type, sku.upgrade_from_term);
    e.term_label = DataEnrich.extractTermLabel(sku.short_description);
    return e;
  }
};





// ── COLUMN VISIBILITY ───────────────────────────────────────────────────────────
// User-configurable column visibility, persisted to localStorage.

const SKU_COLUMNS = [
  { key: 'service_pn', label: 'Service PN', def: true, render: function(s) { return '<td style="font-family:monospace;font-size:12px">' + (s.service_pn||'') + '</td>'; } },
  { key: 'short_description', label: 'Short Description', def: true, render: function(s) { return '<td>' + (s.short_description||'—') + '</td>'; } },
  { key: 'type_of_service', label: 'Type of Service', def: true, render: function(s) { return '<td>' + (s.type_of_service||'—') + '</td>'; } },
  { key: 'service_tier', label: 'Service Tier', def: true, render: function(s) { return '<td>' + (s.service_tier||'—') + '</td>'; } },
  { key: 'pos_or_apos', label: 'POS/APOS', def: true, render: function(s) { return '<td>' + (s.pos_or_apos||'—') + '</td>'; } },
  { key: 'term_label', label: 'Term Label', def: true, render: function(s) { return '<td>' + (s.term_label||'—') + '</td>'; } },
  { key: 'starting_point', label: 'Starting Point', def: true, render: function(s) { return '<td>' + (s.starting_point||'—') + '</td>'; } },
  { key: 'geo', label: 'GEO', def: true, render: function(s) { return '<td>' + (s.geo||'—') + '</td>'; } },
  { key: 'country', label: 'Country', def: true, render: function(s) { return '<td>' + (s.country||'—') + '</td>'; } },
  { key: 'service_term', label: 'Term (mo)', def: false, render: function(s) {
    var v = s.service_term;
    if (v==null||v==='') return '<td>—</td>';
    return '<td>' + (String(v).match(/^\d+$/) ? v+'Y' : v) + '</td>';
  } },
  { key: 'upgrade_from_type', label: 'From Type', def: true, render: function(s) { return '<td>' + (s.upgrade_from_type||'—') + '</td>'; } },
  { key: 'upgrade_from_term', label: 'From Term', def: true, render: function(s) {
    var v = s.upgrade_from_term;
    if (v==null||v==='') return '<td>—</td>';
    return '<td>' + (String(v).match(/^\d+$/) ? v+'Y' : v) + '</td>';
  } },
  { key: 'psc_value', label: 'PSC', def: true, render: function(s) { return '<td class="text-right">' + (s.psc_value!=null ? fmt(s.psc_value) : '—') + '</td>'; } },
  { key: 'sales_cost', label: 'Sales Cost', def: true, render: function(s) { return '<td class="text-right">' + (s.sales_cost!=null ? fmt(s.sales_cost) : '—') + '</td>'; } },
  { key: 'sales_cost_source', label: 'Source', def: true, render: function(s) { return '<td>' + sourceBadge(s.sales_cost_source) + '</td>'; } },
  { key: 'offering_type', label: 'Offering Type', def: false, render: function(s) { return '<td>' + (s.offering_type||'—') + '</td>'; } },
  { key: 'sub_service_tier', label: 'Sub Tier', def: false, render: function(s) { return '<td>' + (s.sub_service_tier||'—') + '</td>'; } },
  { key: 'service_delivery_type', label: 'Delivery Type', def: false, render: function(s) { return '<td>' + (s.service_delivery_type||'—') + '</td>'; } },
  { key: 'aipc', label: 'AIPC', def: true, render: function(s) {
    var v = s.aipc || 'No';
    return '<td><span class="aipc-badge ' + (v==='Yes'?'aipc-yes':'aipc-no') + '" onclick="toggleAIPC(' + s.id + ')" style="cursor:pointer;user-select:none">' + v + '</span></td>';
  } },
  { key: '_actions', label: '', def: true, render: function(s) { return renderSkuActions(s); } },
];

var skuVisibleCols = (function() {
  try {
    var saved = localStorage.getItem('stage3_visible_cols');
    if (saved) return JSON.parse(saved);
  } catch(e) {}
  var defs = [];
  SKU_COLUMNS.forEach(function(c) { if (c.def) defs.push(c.key); });
  return defs;
})();

function saveVisibleCols() {
  try { localStorage.setItem('stage3_visible_cols', JSON.stringify(skuVisibleCols)); } catch(e) {}
}

function isColVisible(key) { return skuVisibleCols.indexOf(key) !== -1; }

function toggleCol(key) {
  var idx = skuVisibleCols.indexOf(key);
  if (idx === -1) skuVisibleCols.push(key); else skuVisibleCols.splice(idx, 1);
  saveVisibleCols();
}

function selectAllCols(show) {
  SKU_COLUMNS.forEach(function(c) {
    if (c.key === '_actions') return; // always keep actions
    if (show) addVisibleCol(c.key); else removeVisibleCol(c.key);
  });
  renderSkuData();
  // Re-render the dropdown to update checkboxes
  var dd = document.querySelector('.col-dropdown');
  if (dd) dd.innerHTML = ''; // will be rebuilt on next toggle click
}

function renderColToggle() {
  var html = '<div class="col-toggle"><button class="btn btn-sm" onclick="this.nextElementSibling.classList.toggle(\'hidden\')">\u2699 Columns</button>';
  html += '<div class="col-dropdown hidden" style="position:absolute;background:#fff;border:1px solid #ddd;border-radius:4px;padding:8px;z-index:10;max-height:400px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.1);min-width:200px">';
  html += '<div style="display:flex;gap:8px;padding:4px 8px;border-bottom:1px solid #e5e7eb;margin-bottom:4px">';
  html += '<a href="#" onclick="selectAllCols(true);return false" style="font-size:11px;color:#4263C7">Select All</a>';

var skuFilters = { search: '', service_tier: 'all', country: 'all', geo: 'all', pos_or_apos: 'all', type_of_service: 'all' };

function resetSkuFilters() {
  skuFilters = { search: '', service_tier: 'all', country: 'all', geo: 'all', pos_or_apos: 'all', type_of_service: 'all' };
  skuPage = 1;
}

function applySkuFilters(skus) {
  return skus.filter(function(s) {
    if (skuFilters.search) {
      var q = skuFilters.search.toLowerCase();
      var match = (s.service_pn||'').toLowerCase().indexOf(q) !== -1 ||
                  (s.short_description||'').toLowerCase().indexOf(q) !== -1 ||
                  (s.country||'').toLowerCase().indexOf(q) !== -1 ||
                  (s.service_tier||'').toLowerCase().indexOf(q) !== -1 ||
                  (s.type_of_service||'').toLowerCase().indexOf(q) !== -1;
      if (!match) return false;
    }
    if (skuFilters.service_tier !== 'all' && s.service_tier !== skuFilters.service_tier) return false;
    if (skuFilters.country !== 'all' && s.country !== skuFilters.country) return false;
    if (skuFilters.geo !== 'all' && s.geo !== skuFilters.geo) return false;
    if (skuFilters.pos_or_apos !== 'all' && s.pos_or_apos !== skuFilters.pos_or_apos) return false;
    if (skuFilters.type_of_service !== 'all' && s.type_of_service !== skuFilters.type_of_service) return false;
    return true;
  });
}

function getFilterOptions(all) {
  var opts = { service_tier: {}, country: {}, geo: {}, pos_or_apos: {}, type_of_service: {} };
  all.forEach(function(s) {
    if (s.service_tier) opts.service_tier[s.service_tier] = 1;
    if (s.country) opts.country[s.country] = 1;
    if (s.geo) opts.geo[s.geo] = 1;
    if (s.pos_or_apos) opts.pos_or_apos[s.pos_or_apos] = 1;
    if (s.type_of_service) opts.type_of_service[s.type_of_service] = 1;
  });
  return opts;
}

function renderFilterBar() {
  var active = 0;
  for (var k in skuFilters) { if (skuFilters[k] !== 'all' && skuFilters[k] !== '') active++; }
  var h = '<div class="filter-bar" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;padding:8px 0">';
  h += '<input type="text" id="sku-search" placeholder="Search..." value="' + (skuFilters.search||'') + '" oninput="skuFilters.search=this.value;skuPage=1;renderSkuData()" style="padding:6px 10px;border:1px solid #ddd;border-radius:4px;font-size:13px;width:180px">';

  }
  h += '<span style="font-size:12px;color:#ABA8B1;margin-left:auto">' + active + ' active filter(s)</span>';
  h += '</div>';

}

function renderFilterSelect(key, label) {
  var h = '<select onchange="skuFilters.' + key + '=this.value;skuPage=1;renderSkuData()" style="padding:6px 8px;border:1px solid #ddd;border-radius:4px;font-size:12px">';

const db = new Dexie('GPSPricingV1');

db.version(1).stores({

  cycles:                   '++id, &name',

  uplift_factor_definitions:'++id, &technical_id',

  uplift_catalogs:          '++id, &catalog_id, type_of_service, geo, status',

  uplift_catalog_factors:   '++id, [catalog_id+factor_def_id], catalog_id',

  uplift_rules:             '++id, &rule_id, catalog_id, type_of_service, geo, status',

  uplift_rule_factors:      '++id, [rule_id+factor_def_id], rule_id',

  service_pns:              '++id, [cycle_id+service_pn+country], cycle_id, type_of_service, geo',

});

db.version(2).stores({

  uplift_catalogs:          '++id, &catalog_id, service_tier, geo, status',

  uplift_rules:             '++id, &rule_id, catalog_id, service_tier, geo, status',

  service_pns:              '++id, [cycle_id+service_pn+country], cycle_id, service_tier, geo',

}).upgrade(async tx => {

  // Rename type_of_service → service_tier, service_delivery_type → type_of_service

  const migrate = rec => {

    if ('type_of_service' in rec)      { rec.service_tier = rec.type_of_service; delete rec.type_of_service; }

    if ('service_delivery_type' in rec) { rec.type_of_service = rec.service_delivery_type; delete rec.service_delivery_type; }

  };

  await tx.table('service_pns').toCollection().modify(migrate);

  await tx.table('uplift_catalogs').toCollection().modify(rec => {

    if ('type_of_service' in rec) { rec.service_tier = rec.type_of_service; delete rec.type_of_service; }

  });

  await tx.table('uplift_rules').toCollection().modify(rec => {

    if ('type_of_service' in rec) { rec.service_tier = rec.type_of_service; delete rec.type_of_service; }

  });

});

db.version(3).stores({

  uplift_values:        '++id, &value_id, catalog_id, service_tier, geo, status',

  uplift_value_factors: '++id, [value_id+factor_def_id], value_id',

  uplift_rules:         null,

  uplift_rule_factors:  null,

}).upgrade(async tx => {

  // Step 1: copy uplift_rules → uplift_values (rename field rule_id → value_id)

  // and copy uplift_rule_factors → uplift_value_factors (rename field rule_id → value_id)

  const oldRules = await tx.table('uplift_rules').toArray();

  const oldIdToNewId = {};

  for (const r of oldRules) {

    const { id: oldId, rule_id, ...rest } = r;

    const newId = await tx.table('uplift_values').add({ value_id: rule_id, ...rest });

    oldIdToNewId[oldId] = newId;

  }

  const oldFactors = await tx.table('uplift_rule_factors').toArray();

  for (const f of oldFactors) {

    const { id: _id, rule_id: oldRuleId, ...rest } = f;

    const newValueId = oldIdToNewId[oldRuleId];

    if (newValueId != null) {

      await tx.table('uplift_value_factors').add({ value_id: newValueId, ...rest });

    }

  }

});

db.version(4).stores({

  uplift_rules:         '++id, &rule_id, service_tier, geo, status',

  uplift_rule_factors:  '++id, [rule_id+factor_def_id], rule_id',

  uplift_values:        '++id, &value_id, rule_id, service_tier, geo, status',

  uplift_catalogs:      null,

  uplift_catalog_factors: null,

}).upgrade(async tx => {

  // Step 2: copy uplift_catalogs → uplift_rules (rename field catalog_id → rule_id)

  // and copy uplift_catalog_factors → uplift_rule_factors (rename field catalog_id → rule_id)

  // and update uplift_values FK: catalog_id → rule_id with remapped IDs

  const oldCats = await tx.table('uplift_catalogs').toArray();

  const catIdToNewRuleId = {};

  for (const c of oldCats) {

    const { id: oldId, catalog_id, ...rest } = c;

    const newId = await tx.table('uplift_rules').add({ rule_id: catalog_id, ...rest });

    catIdToNewRuleId[oldId] = newId;

  }

  const oldCatFactors = await tx.table('uplift_catalog_factors').toArray();

  for (const f of oldCatFactors) {

    const { id: _id, catalog_id: oldCatId, ...rest } = f;

    const newRuleId = catIdToNewRuleId[oldCatId];

    if (newRuleId != null) {

      await tx.table('uplift_rule_factors').add({ rule_id: newRuleId, ...rest });

    }

  }

  // Update uplift_values: rename FK field catalog_id → rule_id with remapped IDs

  await tx.table('uplift_values').toCollection().modify(rec => {

    if ('catalog_id' in rec) {

      rec.rule_id = catIdToNewRuleId[rec.catalog_id] ?? null;

      delete rec.catalog_id;

    }

  });

});



db.version(5).stores({

  uplift_rules:  '++id, &rule_id, type_of_service, geo, status',

  uplift_values: '++id, &value_id, rule_id, type_of_service, geo, status',

  service_pns:   '++id, [cycle_id+service_pn+country], cycle_id, type_of_service, geo',

}).upgrade(async tx => {

  // Revert v2: restore type_of_service and service_delivery_type

  await tx.table('service_pns').toCollection().modify(rec => {

    if ('type_of_service' in rec) { rec.service_delivery_type = rec.type_of_service; delete rec.type_of_service; }

    if ('service_tier' in rec)    { rec.type_of_service = rec.service_tier; delete rec.service_tier; }

  });

  await tx.table('uplift_rules').toCollection().modify(rec => {

    if ('service_tier' in rec) { rec.type_of_service = rec.service_tier; delete rec.service_tier; }

  });

  await tx.table('uplift_values').toCollection().modify(rec => {

    if ('service_tier' in rec) { rec.type_of_service = rec.service_tier; delete rec.service_tier; }

  });

});



async function initDB() {

  const count = await db.uplift_factor_definitions.count();

  if (count === 0) {

    await db.uplift_factor_definitions.bulkAdd(

      FACTOR_DEFINITIONS.map((f,i) => ({...f, description:'', sort_order:i}))

    );

  } else {

    const validIds = new Set(FACTOR_DEFINITIONS.map(f=>f.technical_id));

    // Sync renames and remove obsolete entries

    const all = await db.uplift_factor_definitions.toArray();

    for (const rec of all) {

      if (!validIds.has(rec.technical_id)) {

        await db.uplift_factor_definitions.delete(rec.id);

      }

    }

    for (const def of FACTOR_DEFINITIONS) {

      const rec = await db.uplift_factor_definitions.where('technical_id').equals(def.technical_id).first();

      if (rec && (rec.factor_name !== def.factor_name || rec.classification !== def.classification)) {

        await db.uplift_factor_definitions.update(rec.id, {factor_name:def.factor_name, classification:def.classification});

      }

    }

    // Add any new factor definitions not yet in DB (e.g. restored SRVTIER/SUBSRVTIER)

    for (let i = 0; i < FACTOR_DEFINITIONS.length; i++) {

      const def = FACTOR_DEFINITIONS[i];

      const rec = await db.uplift_factor_definitions.where('technical_id').equals(def.technical_id).first();

      if (!rec) {

        await db.uplift_factor_definitions.add({...def, description:'', sort_order:i});

      }

    }

  }

}

function fmt(v, d=2) {

  if (v==null||v===''||isNaN(v)) return '—';

  return Number(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});

}

function pct(v) {

  if (v==null||v===''||isNaN(v)) return '—';

  return (Number(v)*100).toFixed(2)+'%';

}

function safeStr(v) {

  if (v==null) return null;

  const s = String(v).trim();

  return s || null;

}

function safeFloat(v) {

  if (v==null) return null;

  if (typeof v==='number' && isNaN(v)) return null;

  const s = String(v).trim().replace('%','').replace(',','');

  const f = parseFloat(s);

  return isNaN(f) ? null : f;

}

function parseRatio(v) {

  if (v==null) return 0;

  const s = String(v).trim();

  if (s.endsWith('%')) { const f=parseFloat(s); return isNaN(f)?0:f/100; }

  const f = parseFloat(s);

  if (isNaN(f)) return 0;

  return Math.abs(f)>1 ? f/100 : f;

}

function parseDate(v) {

  if (!v) return null;

  const s = String(v).trim();

  const fmts = [

    s => { const d=new Date(s); return isNaN(d)?null:d.toISOString().slice(0,10); },

    s => { const [d,m,y]=s.split('/'); return y?`${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`:null; },

    s => { const [d,m,y]=s.split('-'); return y&&y.length===4?`${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`:null; },

  ];

  for (const fn of fmts) { try { const r=fn(s); if(r) return r; } catch{} }

  return s||null;

}

function now() { return new Date().toISOString(); }  // kept for Dexie compat



function statusBadge(s) {

  const map={Draft:'badge-draft',Released:'badge-released',Retired:'badge-retired'};

  return `<span class="badge ${map[s]||'badge-draft'}">${s||'Draft'}</span>`;

}

function sourceBadge(s) {

  if (!s) return '—';

  if (s==='Auto-Calculation') return '<span class="badge badge-auto">Auto</span>';

  if (s==='No Rule') return '<span class="badge badge-norule">No Rule</span>';

  return `<span class="badge badge-draft">${s}</span>`;

}

function clsBadge(c) {

  const map={'Territory':'badge-territory','Hardware':'badge-hardware','Service Type':'badge-service-type',

    'Service Period':'badge-service-period','SLA':'badge-sla','Service Scope':'badge-service-scope'};

}

async function exportUpliftCSV() {
  try {
    var values = await db.uplift_values.toArray();
    if (!values.length) { toast('No uplift values to export', 'warn'); return; }
    var allFactors = await db.uplift_value_factors.toArray();
    var allRules = await db.uplift_rules.toArray();
    var ruleMap = {}; allRules.forEach(function(r) { ruleMap[r.id] = r; });
    var defs = await db.uplift_factor_definitions.toArray();
    var defMap = {}; defs.forEach(function(d) { defMap[d.id] = d; });
    
    var rows = [];
    rows.push(['Uplift Factors ID','Description','Type of Service','GEO','Factor Name','Factor Values','Uplift Value','Status']);
    
    for (var vi = 0; vi < values.length; vi++) {
      var v = values[vi];
      var rule = ruleMap[v.rule_id] || {};
      var factors = allFactors.filter(function(f) { return f.value_id === v.id; });
      if (factors.length === 0) {
        // Output single row with no factor
        rows.push([v.value_id, v.description||'', v.type_of_service||'', v.geo||'', '', '', '', v.status||'']);
      }
      for (var fi = 0; fi < factors.length; fi++) {
        var f = factors[fi];
        var def = defMap[f.factor_def_id] || {};
        var upliftVal = f.uplift_type === 'absolute' ? f.uplift_ratio : (f.uplift_ratio*100).toFixed(2);
        rows.push([
          rule.rule_id || v.value_id,
          rule.description || v.description||'',
          v.type_of_service||'',
          v.geo||'',
          def.factor_name || f.factor_name || '',
          f.factor_values||'',
          upliftVal,
          v.status||'Draft'
        ]);
      }
    }
    
    var csv = rows.map(function(r) {
      return r.map(function(c) {
        var s = String(c==null?'':c);
        return s.includes(',')||s.includes('"')||s.includes('\n') ? '"'+s.replace(/"/g,'""')+'"' : s;
      }).join(',');
    }).join('\n');
    
    var blob = new Blob([csv], {type:'text/csv'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'uplift_values_export.csv';
    a.click();
    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
    toast('Exported ' + (rows.length-1) + ' rows', 'success');
  } catch(e) { toast('Export error: ' + e.message, 'error'); }
}

  var headers = parseCSVLine(lines[0]);

    var geo = vals[colMap['GEO'] || 3] || '';

        status: status, created_by: currentUser, created_at: now()

    var factorValues = vals[colMap['Factor Values'] || 6] || '';
    var upliftValue = parseFloat(vals[colMap['Uplift Value'] || 7]) || 0;
    
    if (factorName && upliftValue) {
      var valueId = await db.uplift_values.add({
        rule_id: rule.id, value_id: ruleId + '_' + factorName.replace(/[^a-zA-Z0-9]/g, '_'),

      });

        factor_values: factorValues, uplift_ratio: upliftValue, uplift_type: upliftType

// ── DUPLICATE DETECTION ───────────────────────────────────────────────────────
// Checks for duplicate Service PN + Country within the import batch.
// Returns { duplicates: [{ key, count, rows }], warningMsg: string|null }

function detectDuplicates(skus) {
  var seen = {};
  for (var i = 0; i < skus.length; i++) {
    var key = (skus[i].service_pn || '') + '|' + (skus[i].country || '');
    if (!seen[key]) seen[key] = [];
    seen[key].push(i);
  }
  var dups = [];
  for (var k in seen) {
    if (seen[k].length > 1) dups.push({ key: k, count: seen[k].length, rows: seen[k] });
  }
  if (!dups.length) return { duplicates: [], warningMsg: null };
  var parts = dups.map(function(d) { return d.key.replace('|', ' / ') + ' (' + d.count + 'x)'; });
  return {
    duplicates: dups,
    warningMsg: 'Duplicate Service PN + Country found: ' + parts.join('; ') + '. Last record will overwrite.'
  };
}

async function doImportExcel(arrayBuffer) {

  const wb = XLSX.read(arrayBuffer, {type:'array', cellDates:true});

  let skusImported=0, catsImported=0, rulesImported=0;

  const errors=[];



  // --- Parse SKU sheet ---

  const skuSheetNames = ['Maintenance and Search UI','SKU Data','Service PNs'];

  let skuSheet = null;

  for (const n of skuSheetNames) { if (wb.SheetNames.includes(n)) { skuSheet=wb.Sheets[n]; break; } }

  if (!skuSheet) { errors.push('SKU sheet not found'); }

  else {

    const rows = XLSX.utils.sheet_to_json(skuSheet, {header:1, defval:null, raw:false});

    // row 0 = instructions, row 1 = headers, row 2+ = data

    if (rows.length>=2) {

      const headers = (rows[1]||[]).map(h=>safeStr(h)||'');

      const skus = [];

      for (let i=2;i<rows.length;i++) {

        const row = rows[i];

        if (!row || row.every(c=>c==null||c==='')) continue;

        const sku = buildSkuRow(headers, row);

        if (sku) skus.push(sku);

      }

      var dupCheckXl = detectDuplicates(skus);
      if (dupCheckXl.warningMsg) toast(dupCheckXl.warningMsg, 'info');
      const {count, errs} = await upsertSkus(skus);

      skusImported=count; errors.push(...errs);

    }

  }



  // --- Parse catalog sheet ---

  const catSheetNames = ['Custom Uplift Factors Catalog','Uplift Catalogs','Catalogs'];

  let catSheet = null;

  for (const n of catSheetNames) { if (wb.SheetNames.includes(n)) { catSheet=wb.Sheets[n]; break; } }

  if (catSheet) {

    const cats = parseUpliftRuleSheet(catSheet);

    const {count, errs} = await upsertUpliftRules(cats);

    catsImported=count; errors.push(...errs);

  }



  // --- Parse rules sheet ---

  const ruleSheetNames = ['Customize Uplift Formula','Uplift Rules','Rules'];

  let ruleSheet = null;

  for (const n of ruleSheetNames) { if (wb.SheetNames.includes(n)) { ruleSheet=wb.Sheets[n]; break; } }

  if (ruleSheet) {

    const rules = parseUpliftValueSheet(ruleSheet);

    const {count, errs} = await upsertUpliftValues(rules);

    rulesImported=count; errors.push(...errs);

  }



  const msg = `Imported: ${skusImported} SKUs, ${catsImported} catalogs, ${rulesImported} rules`;

}



async function doImportCSV(text) {

  const lines = text.split('\n').filter(l=>l.trim());

  if (lines.length<2) { toast('CSV needs a header row + data','error'); return; }

  const headers = parseCSVLine(lines[0]);

  const skus=[];

  for (let i=1;i<lines.length;i++) {

    const vals = parseCSVLine(lines[i]);

    if (!vals.length) continue;

    const row = {};

    headers.forEach((h,j) => row[h.trim()] = vals[j]||null);

    const sku = buildSkuRowFromDict(row);

    if (sku) skus.push(sku);

  }

  if (!skus.length) { toast('No valid SKU rows found','error'); return; }

  const {count, errs} = await upsertSkus(skus);

  const msg = `Imported ${count} SKUs`;

  el('import-status').textContent=msg;

  toast(msg, errs.length?'info':'success');

  el('csv-paste').value='';

  await renderSkuData();

}



function parseCSVLine(line) {

  const result=[];

  let cur='', inQ=false;

  for (let i=0;i<line.length;i++) {

    const c=line[i];

    if (c==='"') { inQ=!inQ; }

    else if (c===','&&!inQ) { result.push(cur); cur=''; }

    else cur+=c;

  }

  result.push(cur);

  return result;

}



function buildSkuRow(headers, row) {

  const dict={};

  headers.forEach((h,i) => dict[h] = row[i]??null);

  return buildSkuRowFromDict(dict);

}



function buildSkuRowFromDict(dict) {

  const sku={};

  let currencySeen=false;

  for (const [col, val] of Object.entries(dict)) {

    const colStr = String(col).trim();

    if (SKIP_COLUMNS.has(colStr)) continue;

    if (colStr==='Currency') { if(!currencySeen){ sku.currency=safeStr(val); currencySeen=true; } continue; }

    const field = SKU_COLUMN_MAP[colStr];

    if (!field) continue;

    if (field==='psc_value') sku[field]=safeFloat(val);

    else if (field==='service_term'||field==='upgrade_from_term') sku[field]=safeStr(val);

    else sku[field]=safeStr(val);

  }

  if (!sku.service_pn) return null;

  return DataEnrich.enrich(sku);

}



async function upsertSkus(skus) {

  let count=0; const errs=[];

  // Load existing for this cycle to enable update-or-insert

  const existing = await db.service_pns.where('cycle_id').equals(currentCycleId).toArray();

  const existMap={};

  for (const s of existing) existMap[`${s.service_pn}|${s.country||''}`]=s.id;



  const toAdd=[], toPut=[];

  for (const sku of skus) {

    if (!sku.service_pn) continue;

    const key=`${sku.service_pn}|${sku.country||''}`;

    const rec={...sku, cycle_id:currentCycleId, imported_by:currentUser, imported_at:now()};

    if (existMap[key]!=null) { rec.id=existMap[key]; toPut.push(rec); }

    else toPut.push(rec);

    count++;

  }

  try { await db.service_pns.bulkPut(toPut); }

  catch(e) { errs.push('SKU upsert error: '+e.message); }

  return {count, errs};

}



// Uplift Rule block parser

function parseUpliftRuleSheet(sheet) {

  const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:null, raw:false});

  const upliftRules=[];

  let i=0;

  while (i<rows.length) {

    const row=rows[i];

    const rv=(row||[]).map(c=>safeStr(c)||'');

    if (rv.some(v=>v.includes('Uplift Factors ID'))) {

      const cat={rule_id:safeStr(row[1]), description:safeStr(row[3]), selected_factor_names:[]};

      i++;

      let factorsHeaderSeen=false;

      while (i<rows.length) {

        const r=rows[i];

        const rv2=(r||[]).map(c=>safeStr(c)||'');

        if (rv2.every(v=>v==='')) break;

        const a=rv2[0]||'';

        const b=safeStr(r&&r[1]);

        const d=safeStr(r&&r[3]);

        if (a.includes('Type of Service')) { cat.type_of_service=b; cat.geo=d; }

        else if (a.includes('Valid From')) { cat.valid_from=parseDate(b); cat.valid_to=parseDate(d); }

        else if (a.includes('Status')&&!cat.status) { cat.status=b||'Draft'; }

        else if (rv2.join(' ').includes('Available Uplift Factor List')||rv2.join(' ').includes('Selected Uplift Factor List')) {

          factorsHeaderSeen=true;

        } else if (factorsHeaderSeen) {

          const cv=safeStr(r&&r[2]);

          if (cv&&!['Selected Uplift Factor List','Available Uplift Factor List','Uplift Factor Name'].includes(cv))

            cat.selected_factor_names.push(cv);

        }

        i++;

      }

      if (cat.rule_id) upliftRules.push(cat);

      continue;

    }

    i++;

  }

  return upliftRules;

}



async function upsertUpliftRules(cats) {

  let count=0; const errs=[];

  const factorDefs = await db.uplift_factor_definitions.toArray();

  const fnameMap={};

  factorDefs.forEach(f=>fnameMap[f.factor_name.trim().toLowerCase()]=f.id);



  for (const cat of cats) {

    if (!cat.rule_id) continue;

    try {

      const existing = await db.uplift_rules.where('rule_id').equals(cat.rule_id).first();

      let catDbId;

      const rec={rule_id:cat.rule_id, description:cat.description, type_of_service:cat.type_of_service,

        geo:cat.geo, valid_from:cat.valid_from, valid_to:cat.valid_to, status:cat.status||'Draft',

        created_by:currentUser, created_at:now()};

      if (existing) { catDbId=existing.id; await db.uplift_rules.update(catDbId, rec); }

      else { catDbId=await db.uplift_rules.add(rec); }



      // Re-insert factors (don't duplicate)

      for (let si=0;si<(cat.selected_factor_names||[]).length;si++) {

        const fname=cat.selected_factor_names[si].trim().toLowerCase();

        const fid=fnameMap[fname];

        if (!fid) continue;

        const already=await db.uplift_rule_factors.where('[rule_id+factor_def_id]').equals([catDbId,fid]).count();

        if (!already) await db.uplift_rule_factors.add({rule_id:catDbId, factor_def_id:fid, sort_order:si});

      }

      count++;

    } catch(e) { errs.push(`Uplift Rule ${cat.rule_id}: ${e.message}`); }

  }

  return {count, errs};

}



// Uplift Value block parser

function parseUpliftValueSheet(sheet) {

  const rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:null, raw:false});

  const upliftValues=[];

  let i=0;

  while (i<rows.length) {

    const row=rows[i];

    const rv=(row||[]).map(c=>safeStr(c)||'');

    if (rv.some(v=>v.includes('Uplift Rule ID'))) {

      const rule={value_id:safeStr(row[1]), description:safeStr(row[3]), factors:[]};

      i++;

      let inFactorRows=false;

      const currentFactors=[];

      while (i<rows.length) {

        const r=rows[i];

        const rv2=(r||[]).map(c=>safeStr(c)||'');

        if (rv2.every(v=>v==='')) break;

        const a=rv2[0]||'';

        const b=safeStr(r&&r[1]);

        const d=safeStr(r&&r[3]);

        if (a.includes('Select Uplift Factor Catalog')) { rule.rule_id_text=b; }

        else if (a.includes('Type of Service')) { rule.type_of_service=b; rule.geo=d; }

        else if (a.includes('Valid From')) { rule.valid_from=parseDate(b); rule.valid_to=parseDate(d); }

        else if (a.includes('Status')&&!rule.status) { rule.status=b||'Draft'; }

        else if (a.includes('Uplift Factor Name')) { inFactorRows=true; }

        else if (a.includes('Uplift Formula')||a.includes('Total Uplift')) {

          if (currentFactors.length) rule.factors=currentFactors.slice();

          inFactorRows=false;

        } else if (inFactorRows&&a) {

          // a=factor name, b=values, col C (idx 2)=ratio

          const c=safeStr(r&&r[2]);

          currentFactors.push({factor_name_raw:a.trim(), factor_values:b||'', ratio_raw:c||'0'});

        }

        i++;

      }

      if (inFactorRows&&currentFactors.length) rule.factors=currentFactors.slice();

      if (rule.value_id) upliftValues.push(rule);

      continue;

    }

    i++;

  }

  return upliftValues;

}



async function upsertUpliftValues(rules) {

  let count=0; const errs=[];

  const factorDefs = await db.uplift_factor_definitions.toArray();

  const fnameMap={};

  factorDefs.forEach(f=>fnameMap[f.factor_name.trim().toLowerCase()]=f);



  for (const rule of rules) {

    if (!rule.value_id) continue;

    try {

      // Resolve uplift rule (formerly catalog)

      let ruleDbId=null;

      if (rule.rule_id_text) {

        const c=await db.uplift_rules.where('rule_id').equals(rule.rule_id_text.trim()).first();

        if (c) ruleDbId=c.id;

      }

      const existing=await db.uplift_values.where('value_id').equals(rule.value_id).first();

      let valueDbId;

      const rec={value_id:rule.value_id, description:rule.description, rule_id:ruleDbId,

        type_of_service:rule.type_of_service, geo:rule.geo,

        valid_from:rule.valid_from, valid_to:rule.valid_to, status:rule.status||'Draft',

        created_by:currentUser, created_at:now()};

      if (existing) { valueDbId=existing.id; await db.uplift_values.update(valueDbId, rec); }

      else { valueDbId=await db.uplift_values.add(rec); }



      // Clear and re-insert factors

      await db.uplift_value_factors.where('value_id').equals(valueDbId).delete();

      for (const f of (rule.factors||[])) {

        const fname=(f.factor_name_raw||'').trim().toLowerCase();

        const fd=fnameMap[fname];

        if (!fd) continue;

        await db.uplift_value_factors.add({value_id:valueDbId, factor_def_id:fd.id,

          factor_values:f.factor_values||'', uplift_ratio:parseRatio(f.ratio_raw)});

      }

      count++;

    } catch(e) { errs.push(`Uplift Value ${rule.value_id}: ${e.message}`); }

  }

  return {count, errs};

}

  const cid=el('ur-id').value.trim();

  const selectedEls=el('factors-selected').querySelectorAll('.factor-item');

  const factorIds=[...selectedEls].map(e=>parseInt(e.dataset.id));

  const rec={rule_id:cid, description:safeStr(el('ur-desc').value),

    type_of_service:safeStr(el('ur-tos').value), geo:safeStr(el('ur-geo').value),

    valid_from:safeStr(el('ur-vf').value), valid_to:safeStr(el('ur-vt').value),

    status:el('ur-status').value, created_by:currentUser, created_at:now()};

  try {

    let dbId;

    if (catId) { await db.uplift_rules.update(catId, rec); dbId=catId; }

    else {

      const ex=await db.uplift_rules.where('rule_id').equals(cid).first();

      if (ex) { toast('Uplift Rule ID already exists','error'); return; }

      dbId=await db.uplift_rules.add(rec);

    }

    // Replace factors

    await db.uplift_rule_factors.where('rule_id').equals(dbId).delete();

    for (let i=0;i<factorIds.length;i++)

      await db.uplift_rule_factors.add({rule_id:dbId, factor_def_id:factorIds[i], sort_order:i});

    hideModal(); toast('Uplift Rule saved','success');

    await renderUpliftTab();

}

async function seedSampleUpliftData() {

  const existing = await db.uplift_rules.count();

  if (existing > 0 && !confirm('Uplift rules already exist. Add sample rules alongside existing ones?')) return;



  const factorDefs = await db.uplift_factor_definitions.toArray();

  const fmap = {};

  factorDefs.forEach(f => fmap[f.factor_name.trim().toLowerCase()] = f);



  const today = '2026-01-01';

  const forever = '9999-12-31';



  async function addRule(rule_id, description, type_of_service, geo, factorNames) {

    const rec = { rule_id, description, type_of_service, geo,

      valid_from: today, valid_to: forever, status: 'Released',

      created_by: 'Sample', created_at: now() };

    const dbId = await db.uplift_rules.add(rec);

    for (let i = 0; i < factorNames.length; i++) {

      const fdef = fmap[factorNames[i].toLowerCase()];

      if (fdef) await db.uplift_rule_factors.add({ rule_id: dbId, factor_def_id: fdef.id, sort_order: i });

    }

    return dbId;

function renderFactorRates(catFactors, rfMap={}) {

  if (!catFactors.length) return '<p class="text-muted text-sm">Select an uplift rule to load factor rates.</p>';

  const rows=catFactors.map(f=>{

    const rf=rfMap[f.id]||{};

    const ratioVal = rf.uplift_ratio!=null ? rf.uplift_ratio : 0;
    const displayVal = upliftType === 'absolute' ? ratioVal.toFixed(2) : (ratioVal*100).toFixed(2);
    return `<tr>
      <td>${f.factor_name} ${clsBadge(f.classification)}</td>
      <td><input class="form-control" data-fid="${f.id}" data-field="values" value="${rf.factor_values||''}" placeholder="comma-separated match values" style="min-width:180px"></td>
      <td style="white-space:nowrap">

          <option value="percentage" ${upliftType==='percentage'?'selected':''}>%</option>
          <option value="absolute" ${upliftType==='absolute'?'selected':''}>$</option>
        </select>
        <input class="form-control text-right" data-fid="${f.id}" data-field="ratio" value="${displayVal}" placeholder="0.00" style="width:80px" oninput="updateTotal()">
      </td>

  }).join('');
  return `<table class="tbl"><thead><tr><th>Factor</th><th>Match Values</th><th>Uplift</th></tr></thead>
  <tbody id="factor-rate-rows">${rows}</tbody>
  <tfoot><tr class="total-uplift-row"><td colspan="2" style="text-align:right;font-size:13px">Total Uplift:</td>
  <td><span id="total-uplift-disp">0.00%</span></td></tr></tfoot></table>`;

function updateTotal() {

  const inputs=document.querySelectorAll('[data-field="ratio"]');
  let totalPct=0, totalAbs=0;
  inputs.forEach(inp=>{
    const v=parseFloat(inp.value); if(isNaN(v)) return;
    const fid=inp.dataset.fid;
    const typeSel=document.querySelector(`[data-fid="${fid}"][data-field="type"]`);
    const type=typeSel ? typeSel.value : 'percentage';
    if (type==='absolute') totalAbs+=v;
    else totalPct+=v;
  });
  const d=el('total-uplift-disp');
  if (!d) return;
  let text = '';
  if (totalPct>0) text += totalPct.toFixed(2)+'%';
  if (totalAbs>0) {
    if (text) text += ' + ';
    text += '$'+totalAbs.toFixed(2);
  }
  if (!text) text = '0.00%';
  d.textContent=text;

}

async function saveUpliftValue(ruleId) {

  const rid=el('uv-id').value.trim();

  if (!rid) { toast('Uplift Value ID required','error'); return; }

  const catId=parseInt(el('uv-cat').value)||null;

  // Collect factor rates

  const factors=[];

  document.querySelectorAll('[data-field="values"]').forEach(inp=>{

    const fid=parseInt(inp.dataset.fid);

    const ratioInp=document.querySelector(`[data-fid="${fid}"][data-field="ratio"]`);

    const ratio=parseFloat(ratioInp?.value)||0;

        const typeSel=document.querySelector(`[data-fid="${fid}"][data-field="type"]`);
    const upliftType=typeSel ? typeSel.value : 'percentage';
    const upliftRatio = upliftType==='absolute' ? ratio : ratio/100;
    factors.push({factor_def_id:fid, factor_values:inp.value||'', uplift_ratio:upliftRatio, uplift_type:upliftType});

  });

  const rec={value_id:rid, description:safeStr(el('uv-desc').value), rule_id:catId,

    type_of_service:safeStr(el('uv-tos').value), geo:safeStr(el('uv-geo').value),

    valid_from:safeStr(el('uv-vf').value), valid_to:safeStr(el('uv-vt').value),

    status:el('uv-status').value, created_by:currentUser, created_at:now()};

  try {

    let dbId;

    if (ruleId) { await db.uplift_values.update(ruleId, rec); dbId=ruleId; }

    else {

      const ex=await db.uplift_values.where('value_id').equals(rid).first();

      if (ex) { toast('Uplift Value ID already exists','error'); return; }

      dbId=await db.uplift_values.add(rec);

    await db.uplift_value_factors.where('value_id').equals(dbId).delete();

    for (const f of factors)

      await db.uplift_value_factors.add({value_id:dbId, ...f});

    await renderUpliftTab();

  } catch(e) { toast('Save failed: '+e.message,'error'); }

// ── CALCULATION ENGINE ────────────────────────────────────────────────────────



async function calculateCycle(cycleId) {

  const skus = await db.service_pns.where('cycle_id').equals(cycleId).toArray();

  const withPsc = skus.filter(s=>s.psc_value!=null&&s.psc_value!==0);

  if (!withPsc.length) return {calculated:0, skipped:0, errors:['No SKUs with PSC values found.']};



  // Load all Released uplift values

  const relRules = await db.uplift_values.where('status').equals('Released').toArray();

  const ruleMap={};

  for (const r of relRules) {

    const k=`${(r.type_of_service||'').trim().toLowerCase()}|${(r.geo||'').trim().toLowerCase()}`;

    if (!ruleMap[k]) ruleMap[k]=r;

  }



  // Preload all uplift value factors

  const allRuleIds=[...new Set(Object.values(ruleMap).map(r=>r.id))];

  const rfCache={};

  for (const rId of allRuleIds) {

    const factors=await db.uplift_value_factors.where('value_id').equals(rId).toArray();

    const defs=await Promise.all(factors.map(f=>db.uplift_factor_definitions.get(f.factor_def_id)));

    rfCache[rId]=factors.map((f,i)=>({...f, technical_id:defs[i]?.technical_id, factor_name:defs[i]?.factor_name}));

  }



  let calculated=0, skipped=0;

  const errors=[];

  for (const sku of withPsc) {

    const tos=(sku.type_of_service||'').trim().toLowerCase();

    const geo=(sku.geo||'').trim().toLowerCase();

    const rule=ruleMap[`${tos}|${geo}`];

    if (!rule) {

      await db.service_pns.update(sku.id, {sales_cost_source:'No Rule', sales_cost:null, uplift_formula:null, uplift_ratio:null});

      skipped++; continue;

    }

    try {

      const {salesCost, totalRatio, formula} = calcSku(sku, rfCache[rule.id]||[]);

      await db.service_pns.update(sku.id, {sales_cost:salesCost, sales_cost_source:'Auto-Calculation',

        uplift_ratio:totalRatio, uplift_formula:JSON.stringify(formula)});

      calculated++;

    } catch(e) { errors.push(`SKU ${sku.service_pn}: ${e.message}`); skipped++; }

  }



  // Mark SKUs without PSC

  for (const sku of skus.filter(s=>s.psc_value==null||s.psc_value===0)) {

    await db.service_pns.update(sku.id, {sales_cost_source:'No PSC', sales_cost:null});

    skipped++;

  }



  return {calculated, skipped, errors};

}



function calcSku(sku, ruleFactors) {

  const psc=sku.psc_value;

  let totalRatio=0, totalAbsolute=0;

  const formula=[];

  for (const rf of ruleFactors) {

    const field=FACTOR_FIELD_MAP[rf.technical_id];

    if (!field) continue;

    const skuVal=String(sku[field]||'').trim();

    if (!skuVal) continue;

    const allowed=(rf.factor_values||'').split(',').map(v=>v.trim()).filter(Boolean);

    if (allowed.includes(skuVal)) {

      const val=rf.uplift_ratio||0;
      const type=rf.uplift_type||'percentage';

      if (type==='absolute') {
        totalAbsolute+=val;
        formula.push({factor:rf.factor_name, technical_id:rf.technical_id, sku_value:skuVal, uplift_ratio:val, type:'absolute'});
      } else {
        totalRatio+=val;
        formula.push({factor:rf.factor_name, technical_id:rf.technical_id, sku_value:skuVal, uplift_ratio:val, type:'percentage'});
      }

    }

  }

  // Sales Cost = PSC × (1 + Σ %) + Σ $
  const salesCost=psc*(1+totalRatio)+totalAbsolute;
  return {salesCost, totalRatio, totalAbsolute, formula};

}

  const data=skus.map(s=>headers.reduce((o,h)=>{o[h]=s[h]??'';return o},{}));

  const ws=XLSX.utils.json_to_sheet(data, {header:headers});

  const wb=XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(wb,'Results',ws);

  XLSX.writeFile(wb,'results.xlsx');

  toast('Excel downloaded','success');

}

async function bridgeToStage4() {
  const skus = await db.service_pns.where('cycle_id').equals(currentCycleId).toArray();
  const calcSkus = skus.filter(s => s.sales_cost != null);
  if (!calcSkus.length) { toast('No calculated SKUs to send', 'error'); return; }

  const stage4Data = calcSkus.map(s => ({
    part_number:      s.service_pn,
    tier:             s.service_tier || s.type_of_service || '',
    upgrade_years:    parseInt(s.service_term) / 12 || null,
    delivery_type:    s.service_delivery_type || '',
    region:           s.country || s.geo || '',
    sales_cost:       s.sales_cost,
    base_warranty:    s.offering_type || '',
    upgrade_description: s.sdf_short_description || '',
    included_adp:     s.included_adp || '',
    included_kyd:     s.included_kyd || '',
    included_sbty:    s.included_sbty || '',
    included_ticru:   s.included_ticru || '',
    included_premier: s.included_premier_service || '',
    upgrade_from_type: s.upgrade_from_type || '',
    upgrade_from_term: s.upgrade_from_term || '',
    aipc:             s.aipc || 'No',
  }));

  const cycle = await db.cycles.get(currentCycleId);
  const result = Bridge.saveForNext(3, stage4Data, {
    cycleName: cycle?.name || 'Unknown',
    stage: 3,
    fiscalYear: cycle?.fiscal_year || '',
  });

  if (result.success) {
    toast(`Sent ${result.rowCount} SKUs to Stage 4 via Bridge`, 'success');
    Audit.log.bridgeSend(4, result.rowCount, currentUser, 3);
    // Open Stage 4 in new tab after a short delay
    setTimeout(function() {
      window.open('../stage4_browser/index.html', '_blank');
    }, 800);
  } else {
    toast('Bridge error: ' + result.error, 'error');
  }
}

async function exportToStage4() {

  const cycle = await db.cycles.get(currentCycleId);

  const skus = await db.service_pns.where('cycle_id').equals(currentCycleId).toArray();

  const calculated = skus.filter(s => s.sales_cost != null);

  if (!calculated.length) { toast('No calculated SKUs to export', 'error'); return; }



  // Determine unique regions: prefer country, fall back to geo

  const regions = [...new Set(calculated.map(s => s.country || s.geo || 'Unknown'))].sort();



  // Pivot by service_pn: one row per SKU, one col-block per region

  const pivot = {};

  for (const sku of calculated) {

    const region = sku.country || sku.geo || 'Unknown';

    if (!pivot[sku.service_pn]) {

      pivot[sku.service_pn] = {

        part_number: sku.service_pn,

        tier: sku.service_tier || '',

        base_warranty: sku.service_term || '',

        upgrade: sku.short_description || '',

        type: sku.type_of_service || '',

        adp: sku.included_adp || '',

        kyd: sku.included_kyd || '',

        sbty: sku.included_sbty || '',

        ticru: sku.included_ticru || '',

        premier: sku.included_premier_service || '',

        upg_from_type: sku.upgrade_from_type || '',

        upg_from_term: sku.upgrade_from_term || '',

        prices: {}

      };

    }

    pivot[sku.service_pn].prices[region] = sku.sales_cost;

  }

  const rows = Object.values(pivot);



  // Fixed columns (12): Part#, Tier, Base Warranty, Upgrade, Type,

  //   ADP, KYD, SBTY, TI CRU, Premier, Upg From Type, Upg From Term

  // Then geo blocks (Cost | C-Price | L-Price per region) starting at col 12

  const FIXED_COLS = 12;

  const geoHeaderRow = ['Part#','Tier','Base Warranty','Upgrade','Type','ADP','KYD','SBTY','TI CRU','Premier','Upg From Type','Upg From Term'];

  const subHeaderRow = ['Part#','Tier','Base Warranty','Upgrade','Type','ADP','KYD','SBTY','TI CRU','Premier','Upg From Type','Upg From Term'];

  const merges = [];

  regions.forEach((region, i) => {

    const startCol = FIXED_COLS + i * 3;

    geoHeaderRow.push(region, '', '');

    subHeaderRow.push('Cost', 'C-Price', 'L-Price');

    merges.push({s:{r:0, c:startCol}, e:{r:0, c:startCol+2}});

  });



  const data = [geoHeaderRow, subHeaderRow];

  for (const row of rows) {

    const dataRow = [

      row.part_number, row.tier, row.base_warranty, row.upgrade, row.type,

      row.adp, row.kyd, row.sbty, row.ticru, row.premier,

      row.upg_from_type, row.upg_from_term,

    ];

    for (const region of regions) {

      dataRow.push(row.prices[region] ?? '', '', '');

    }

    data.push(dataRow);

  }



  const ws = XLSX.utils.aoa_to_sheet(data);

  ws['!merges'] = merges;

  ws['!cols'] = [

    {wch:20},{wch:12},{wch:14},{wch:28},{wch:20},

    {wch:6},{wch:6},{wch:6},{wch:8},{wch:8},{wch:14},{wch:14},

    ...regions.flatMap(() => [{wch:10},{wch:10},{wch:10}])

  ];



  const wb = XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(wb, ws, 'Pricing');

  const filename = 'Stage4_Input_' + (cycle?.name || 'export').replace(/[^a-zA-Z0-9_-]/g,'_') + '.xlsx';

  XLSX.writeFile(wb, filename);

  toast('Stage 4 input exported: ' + rows.length + ' SKUs across ' + regions.length + ' regions', 'success');

}



function download(content, filename, mime) {

  const a=document.createElement('a');

  a.href=URL.createObjectURL(new Blob([content],{type:mime}));

  a.download=filename; a.click();

  setTimeout(()=>URL.revokeObjectURL(a.href),1000);

}
