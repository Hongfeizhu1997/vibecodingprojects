<script>
window.onerror = function(msg, src, line, col, err) {
  var p = document.getElementById('_err');
  if (p) p.innerHTML = '<b>JS Error:</b> ' + (err ? err.name + ': ' : '') + msg + '  [line ' + line + ']';
};
window.addEventListener('unhandledrejection', function(e) {
  var p = document.getElementById('_err');
  if (p) p.innerHTML = '<b>Promise Error:</b> ' + (e.reason && e.reason.message ? e.reason.name+': '+e.reason.message : String(e.reason));
});
</script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat','Helvetica Neue',Arial,sans-serif;font-size:14px;background:#F4F4F4;color:#1E0013;min-height:100vh}
a{color:#E1251B;text-decoration:none}

/* ── NAV ── */
.nav{background:#11184F;color:#fff;display:flex;align-items:center;padding:0 20px;height:56px;gap:16px;position:sticky;top:0;z-index:100;flex-wrap:nowrap}
.nav-brand{font-weight:700;font-size:15px;letter-spacing:.3px;white-space:nowrap;color:#fff;text-decoration:none;cursor:pointer}.nav-brand:hover{opacity:.75}
.nav-brand span{color:#e2231a}
.nav-links{display:flex;gap:2px;flex:1}
.nav-links a{color:#c4b5fd;padding:6px 11px;border-radius:4px;font-size:13px;cursor:pointer;white-space:nowrap}
.nav-links a:hover,.nav-links a.active{background:rgba(255,255,255,.15);color:#fff}
.nav-cycle{display:flex;align-items:center;gap:8px}
.nav-cycle select{background:#1A1A1A;color:#fff;border:1px solid #E1251B;border-radius:4px;padding:4px 8px;font-size:12px;cursor:pointer}
.nav-cycle select option{background:#000000;color:#fff}
.nav-user{color:#a78bfa;font-size:12px;white-space:nowrap}

/* ── LAYOUT ── */
.container{max-width:1400px;margin:0 auto;padding:20px}
.card{background:#fff;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:20px;margin-bottom:16px}
.card-title{font-size:15px;font-weight:600;margin-bottom:14px;color:#000000}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.page-header h1{font-size:20px;font-weight:700;color:#000000}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:4px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:background .15s}
.btn-primary{background:#E1251B;color:#fff;border-color:#E1251B}.btn-primary:hover{background:#64131E}
.btn-secondary{background:#fff;color:#374151;border-color:#d1d5db}.btn-secondary:hover{background:#EAEEF5}
.btn-danger{background:#dc2626;color:#fff;border-color:#dc2626}.btn-danger:hover{background:#b91c1c}
.btn-success{background:#065f46;color:#fff;border-color:#065f46}.btn-success:hover{background:#15803d}
.btn-sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ── TABLES ── */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:#FAFAFA;text-align:left;padding:8px 10px;font-weight:600;color:#374151;border-bottom:2px solid #e5e7eb;white-space:nowrap}
.tbl td{padding:7px 10px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.tbl tr:hover td{background:#fafafa}
.tbl-scroll{overflow-x:auto;width:100%}

/* ── BADGES ── */
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-ok{background:#ecfdf5;color:#065f46}
.badge-no-pfv{background:#ffedd5;color:#9a3412}
.badge-below-floor{background:#fee2e2;color:#991b1b}
.badge-info{background:#dbeafe;color:#1e40af}

/* ── FORMS ── */
.form-row{display:grid;gap:12px;margin-bottom:12px}
.form-row-2{grid-template-columns:1fr 1fr}
.form-row-3{grid-template-columns:1fr 1fr 1fr}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-label{font-size:12px;font-weight:600;color:#374151}
.form-control{padding:7px 10px;border:1px solid #d1d5db;border-radius:4px;font-size:13px;color:#1E0013;background:#fff;width:100%}
.form-control:focus{outline:none;border-color:#E1251B;box-shadow:0 0 0 2px rgba(226,35,42,.1)}
select.form-control{cursor:pointer}
.form-control-sm{padding:4px 7px;font-size:12px}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal-overlay.hidden{display:none}
.modal-box{background:#fff;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.2);width:520px;max-width:95vw;max-height:90vh;display:flex;flex-direction:column}
.modal-box.wide{width:800px}
.modal-header{padding:16px 20px;border-bottom:1px solid #e5e7eb;font-weight:700;font-size:15px;color:#000000;display:flex;align-items:center;justify-content:space-between}
.modal-close{cursor:pointer;color:#9ca3af;font-size:18px;line-height:1}.modal-close:hover{color:#374151}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-footer{padding:12px 20px;border-top:1px solid #e5e7eb;display:flex;justify-content:flex-end;gap:8px}

/* ── TOAST ── */
#toast-container{position:fixed;top:60px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:10px 16px;border-radius:6px;font-size:13px;font-weight:500;box-shadow:0 4px 12px rgba(0,0,0,.15);animation:slideIn .2s ease;pointer-events:auto;max-width:320px}
.toast-success{background:#166534;color:#fff}
.toast-error{background:#991b1b;color:#fff}
.toast-info{background:#64131E;color:#fff}
.toast-warn{background:#92400e;color:#fff}
@keyframes slideIn{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideOut{from{transform:translateX(0);opacity:1}to{transform:translateX(110%);opacity:0}}

/* ── UPLOAD ZONE ── */

.upload-zone:hover,.upload-zone.drag-over{border-color:#E1251B;background:#FAECEB}

/* ── STATS ── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:#fff;border:1px solid #E6E2E4;border-radius:4px;padding:14px;text-align:center}
.stat-card .stat-val{font-size:26px;font-weight:700;color:#000000}
.stat-card .stat-label{font-size:11px;color:#6F7170;margin-top:2px}

/* ── FILTER BAR ── */
.filter-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;padding:12px 14px;background:#FAFAFA;border-radius:6px;border:1px solid #E6E2E4}
.filter-bar label{font-size:12px;font-weight:600;color:#374151;white-space:nowrap}
.filter-bar select,.filter-bar input{padding:5px 8px;border:1px solid #d1d5db;border-radius:4px;font-size:12px;color:#1E0013;background:#fff}

/* ── PRICING TABLE ROW COLORS ── */
.row-ok{}
.row-no-pfv td{background:#fff7ed!important}
.row-below-floor td{background:#fef2f2!important}
.row-no-pfv:hover td{background:#ffedd5!important}
.row-below-floor:hover td{background:#fee2e2!important}

/* ── SETTINGS SECTIONS ── */
.settings-section{margin-bottom:24px}
.settings-section-title{font-size:14px;font-weight:700;color:#000000;margin-bottom:14px;padding-bottom:6px;border-bottom:2px solid #e5e7eb}
.radio-group{display:flex;flex-direction:column;gap:10px}
.radio-option{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border:1px solid #E6E2E4;border-radius:6px;cursor:pointer;transition:border-color .15s}
.radio-option:hover{border-color:#E1251B;background:#FAECEB}
.radio-option.selected{border-color:#E1251B;background:#FAECEB}
.radio-option input[type=radio]{margin-top:2px;accent-color:#E1251B}
.radio-label{font-size:13px;font-weight:600;color:#1E0013}
.radio-desc{font-size:12px;color:#6F7170;margin-top:2px}
.toggle-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}

/* ── MISC ── */
.text-muted{color:#6F7170}
.text-sm{font-size:12px}
.text-right{text-align:right}
.text-center{text-align:center}
.hidden{display:none!important}
.section-title{font-size:13px;font-weight:600;color:#374151;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid #e5e7eb}
hr{border:none;border-top:1px solid #e5e7eb;margin:16px 0}
.alert{padding:12px 16px;border-radius:6px;margin-bottom:14px;font-size:13px}
.alert-info{background:#dbeafe;border:1px solid #93c5fd;color:#1e40af}
.alert-warn{background:#fef9c3;border:1px solid #fde68a;color:#854d0e}
.alert-error{background:#fee2e2;border:1px solid #fca5a5;color:#991b1b}
.alert-success{background:#dcfce7;border:1px solid #86efac;color:#166534}
.lenovo-red{color:#e2231a}
.import-summary{background:#f0fdf4;border:1px solid #86efac;border-radius:6px;padding:12px;font-size:13px;margin-top:12px}
.import-summary .imp-count{font-size:22px;font-weight:700;color:#166534}
.pfv-tier-tabs{display:flex;gap:0;border-bottom:2px solid #e5e7eb;margin-bottom:16px;flex-wrap:wrap}
.pfv-tier-tab{padding:8px 14px;font-size:13px;font-weight:500;color:#6F7170;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap}
.pfv-tier-tab:hover{color:#374151}
.pfv-tier-tab.active{color:#E1251B;border-bottom-color:#E1251B;font-weight:600}
.editable-cell{border:none;background:transparent;font-size:13px;color:#1E0013;width:72px;padding:2px 4px}
.editable-cell:focus{outline:1px solid #E1251B;border-radius:3px;background:#FAECEB}
.cycle-name-chip{background:#FAECEB;color:#64131E;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}

/* ── LOGIN ── */
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#000 0%,#1A1A1A 100%)}
.login-card{background:#fff;border-radius:12px;padding:40px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-card h1{font-size:22px;font-weight:700;color:#000000;margin-bottom:4px}
</style>

<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal-box" id="modal-box">
    <div class="modal-header">
      <span id="modal-header-text"></span>
      <span class="modal-close" onclick="closeModal()">&times;</span>
    </div>

<div id="toast-container"></div>
<div id="app">
  <div style="padding:60px;text-align:center;color:#374151">
    <h2>Loading GPS Pricing Stage 5…</h2>
    <p id="_err" style="color:#991b1b;margin-top:12px"></p>
  </div>
</div>

<script>
'use strict';

// ══════════════════════════════════════════════════════
// CONSTANTS & DEFAULTS
// ══════════════════════════════════════════════════════

const APP_VERSION = 'Stage 5 v1.0';

const DEFAULT_SETTINGS = {
  pricing_model:       'C_TO_L',
  topseller_enabled:   'false',
  topseller_discount:  '0.10',
  gp_floor_enabled:    'false',
  gp_floor_pct:        '0.30',
};

const KNOWN_TIERS = ['tablet','premium','classic','edge','education'];

function normalizeTierKey(tier) {
  // Strip "TP " or "TP_" prefix (case-insensitive) then map to KNOWN_TIERS
  let s = safeStr(tier).toLowerCase().replace(/^tp[\s_]+/, '').trim();
  if (s.startsWith('edu')) return 'education';
  if (s === 'tablet')    return 'tablet';
  if (s === 'premium')   return 'premium';
  if (s === 'classic')   return 'classic';
  if (s === 'edge')      return 'edge';
  return s; // fallback — may not match KNOWN_TIERS
}

const DEFAULT_GEO_GROUPS = [
  {group_name:'CENTRAL', countries:'DE,AT,CH,PL,CZ,SK,HU', ratio:0.20, regional_factor:1.0},
  {group_name:'SOUTH',   countries:'FR,IT,ES,PT',           ratio:0.20, regional_factor:1.0},
  {group_name:'UKIR',    countries:'GB,IE',                 ratio:0.20, regional_factor:1.1},
  {group_name:'BENELUX', countries:'BE,NL,LU',              ratio:0.20, regional_factor:1.0},
  {group_name:'EET',     countries:'RO,BG,HR,SI,RS',        ratio:0.20, regional_factor:1.0},
  {group_name:'NA',      countries:'US,CA',                 ratio:0.15, regional_factor:1.0},
  {group_name:'APJ',     countries:'AU,SG,JP,IN',           ratio:0.12, regional_factor:1.0},
];

// ══════════════════════════════════════════════════════
// DATABASE
// ══════════════════════════════════════════════════════

const db = new Dexie('GPSPricingStage5V1');
db.version(1).stores({
  cycles:      '++id, &name',
  price_items: '++id, [cycle_id+part_number+region], cycle_id, tier, region',
  pfv_rows:    '++id, [cycle_id+tier+year], cycle_id, tier',
  settings:    '&key',
  geo_groups:  '++id, &group_name',
});
// v2: schema unchanged — bumped externally by Stage 6 db5 reference, declare here so Dexie accepts the existing DB
db.version(2).stores({
  cycles:      '++id, &name',
  price_items: '++id, [cycle_id+part_number+region], cycle_id, tier, region',
  pfv_rows:    '++id, [cycle_id+tier+year], cycle_id, tier',
  settings:    '&key',
  geo_groups:  '++id, &group_name',
});

async function initDB() {
  // Settings
  const cnt = await db.settings.count();
  if (cnt === 0) {
    await db.settings.bulkPut(
      Object.entries(DEFAULT_SETTINGS).map(([key, value]) => ({key, value}))
    );
  }
  // Geo groups
  const gcnt = await db.geo_groups.count();
  if (gcnt === 0) {
    await db.geo_groups.bulkAdd(DEFAULT_GEO_GROUPS);
  }
}

async function getSetting(key) {
  const row = await db.settings.get(key);
  return row ? row.value : (DEFAULT_SETTINGS[key] ?? null);
}
async function getAllSettings() {
  const rows = await db.settings.toArray();
  const map = {};
  rows.forEach(r => { map[r.key] = r.value; });
  return map;
}
async function saveSetting(key, value) {
  await db.settings.put({key, value: String(value)});
}

// ══════════════════════════════════════════════════════
// APP STATE
// ══════════════════════════════════════════════════════

const STATE = {
  currentCycleId: null,
  currentCycleName: null,
  currentTab: 'import',
  cycles: [],
  pfvTier: null,
  pricingFilter: {regionGroup: '', tier: '', status: '', topsellerOnly: false},
};

// Shared SSO key — same as Stage 3 & Stage 4
let currentUser = localStorage.getItem('gps_user') || null;

// ══════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════

function safeFloat(v) { return UI.safeFloat(v); }
function safeStr(v) { return UI.safeStr(v) || ''; }
function fmt(n) { return UI.fmtCurrency(n, 2); }
function pct(n) { return UI.fmtPct(n, 1); }
function now() { return new Date().toISOString(); }
function el(id) { return UI.$el(id) || document.getElementById(id); }
function isTruthy(v) {
  const s = safeStr(v).toLowerCase();
  if (s === '' || s === '0' || s === 'n' || s === 'no' || s === 'false') return false;
  // numeric > 0 is truthy (handles "40" percentage values)
  const n = parseFloat(s);
  if (!isNaN(n)) return n > 0;
  return true; // 'x', 'yes', 'true', etc.
}
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function csvRow(arr) {
  return arr.map(v => {
    const s = String(v == null ? '' : v);
    return (s.includes(',') || s.includes('"') || s.includes('\n')) ? '"' + s.replace(/"/g,'""') + '"' : s;
  }).join(',');
}

// ══════════════════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════════════════

function toast(msg, type = 'info') {
  const container = el('toast-container');
  const div = document.createElement('div');
  div.className = 'toast toast-' + type;
  div.textContent = msg;
  container.appendChild(div);
  setTimeout(() => {
    div.style.animation = 'slideOut .2s ease forwards';
    setTimeout(() => div.remove(), 220);
  }, 3000);
}

// ══════════════════════════════════════════════════════
// MODAL
// ══════════════════════════════════════════════════════

function openModal(title, bodyHTML, footerHTML, wide = false) {
  el('modal-header-text').textContent = title;
  el('modal-body').innerHTML = bodyHTML;
  el('modal-footer').innerHTML = footerHTML || '';
  el('modal-box').className = 'modal-box' + (wide ? ' wide' : '');
  el('modal-overlay').classList.remove('hidden');
}
function closeModal() {
  el('modal-overlay').classList.add('hidden');
}
el('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ══════════════════════════════════════════════════════
// FILE DOWNLOAD
// ══════════════════════════════════════════════════════

function download(content, filename, mime) {
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ══════════════════════════════════════════════════════
// CYCLE MANAGEMENT
// ══════════════════════════════════════════════════════

async function loadCycles() {
  STATE.cycles = await db.cycles.toArray();
  STATE.cycles.sort((a, b) => b.id - a.id);
}

async function selectCycle(id) {
  const c = STATE.cycles.find(c => c.id === id);
  if (!c) return;
  STATE.currentCycleId = c.id;
  STATE.currentCycleName = c.name;
  renderNav();
  renderCurrentTab();
}

function newCycle() {
  openModal('New Pricing Cycle',
    `<div class="form-group">
       <label class="form-label">Cycle Name *</label>
       <input id="new-cycle-name" class="form-control" placeholder="e.g. FY2025Q2" autofocus>
       <span style="font-size:11px;color:#6F7170;margin-top:4px">A unique name for this pricing cycle</span>
     </div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" onclick="createCycleFromModal()">Create</button>`
  );
  setTimeout(() => {
    const n = document.getElementById('new-cycle-name');
    if (n) { n.focus(); n.addEventListener('keydown', e => { if(e.key==='Enter') createCycleFromModal(); }); }
  }, 50);
}

async function createCycleFromModal() {
  const input = document.getElementById('new-cycle-name');
  const trimmed = (input ? input.value : '').trim();
  if (!trimmed) { toast('Cycle name is required', 'error'); return; }
  const exists = STATE.cycles.find(c => c.name === trimmed);
  if (exists) { toast('Cycle "' + trimmed + '" already exists', 'warn'); return; }
  closeModal();
  const id = await db.cycles.add({name: trimmed, created_at: now()});
  await loadCycles();
  await selectCycle(id);
  toast('Cycle "' + trimmed + '" created', 'success');
}

// ══════════════════════════════════════════════════════
// NAV RENDER
// ══════════════════════════════════════════════════════

function renderNav() {
  const tabs = [
    {id:'import',  label:'Import'},
    {id:'pfv',     label:'PFV Matrix'},
    {id:'pricing', label:'Pricing'},
    {id:'export',  label:'Export'},
    {id:'settings',label:'Settings'},
  ];
  const cycleOptions = STATE.cycles.map(c =>
    `<option value="${c.id}" ${c.id === STATE.currentCycleId ? 'selected' : ''}>${esc(c.name)}</option>`
  ).join('');

  el('app').innerHTML = `
    <nav class="nav">
      <a class="nav-brand" href="../GPS_Cost_Pricing_Workbench.html">GPS Pricing · <span>Stage 5</span></a>
      <div class="nav-links">
        ${tabs.map(t => `<a id="nav-${t.id}" class="${STATE.currentTab === t.id ? 'active' : ''}" onclick="switchTab('${t.id}')">${t.label}</a>`).join('')}
      </div>
      <div class="nav-cycle">
        <select id="cycle-select" onchange="selectCycle(parseInt(this.value))" title="Select cycle">
          ${cycleOptions || '<option value="">— no cycles —</option>'}
        </select>
        <button class="btn btn-sm" style="background:#e2231a;color:#fff;border-color:#e2231a" onclick="newCycle()">+ New Cycle</button>
      </div>
      <span class="nav-user">${esc(currentUser)} &nbsp;|&nbsp; <a href="#" onclick="logout()" style="color:#c4b5fd">Sign out</a></span>
    </nav>
    <div class="container" id="tab-content">
      <p id="_err" style="color:#991b1b;font-size:12px;padding:4px 0"></p>
    </div>
  `;
  renderCurrentTab();
}

  el(zoneId).classList.remove('drag-over');

function handleDrop(e, type, zoneId) {

// ── CSV Import ──

async function importCsvFile(file) {
  const summaryEl = el('csv-summary');
  summaryEl.innerHTML = '<p class="text-muted text-sm" style="margin-top:10px">Reading file…</p>';
  try {
    const text = await file.text();
    const rows = parseCsv(text);
    if (rows.length < 2) { summaryEl.innerHTML = '<div class="alert alert-warn">CSV appears empty or has no data rows.</div>'; return; }

    const headers = rows[0].map(h => safeStr(h).toLowerCase());
    const dataRows = rows.slice(1).filter(r => r.some(c => safeStr(c) !== ''));

    // Column mapping (case-insensitive)
    function col(names) {
      const found = names.map(n => headers.indexOf(n.toLowerCase())).find(i => i !== -1);
      return found !== undefined ? found : -1;
    }

    const colMap = {
      part_number:          col(['part number', 'part_number', 'partnumber']),
      tier:                 col(['tier']),
      base_warranty:        col(['base warranty', 'base_warranty']),
      upgrade_description:  col(['upgrade', 'upgrade description', 'upgrade_description']),
      delivery_type:        col(['delivery type', 'delivery_type']),
      upgrade_years:        col(['upgrade years', 'upgrade_years']),
      included_adp:         col(['adp']),
      included_kyd:         col(['kyd']),
      included_sbty:        col(['sbty']),
      included_ticru:       col(['ti cru', 'ti_cru', 'ticru']),
      included_premier:     col(['premier']),
      upgrade_from_type:    col(['upgrade from type', 'upgrade_from_type']),
      upgrade_from_term:    col(['upgrade from term', 'upgrade_from_term']),
      region:               col(['region']),
      sales_cost:           col(['sales cost', 'sales_cost']),
      channel_price:        col(['channel price', 'channel_price']),
      list_price:           col(['actual list price', 'list price', 'list_price']),
    };

    const warnings = [];
    let imported = 0;
    const items = [];

    for (let i = 0; i < dataRows.length; i++) {
      const r = dataRows[i];
      const getV = (key) => colMap[key] >= 0 ? safeStr(r[colMap[key]]) : '';

      const partNum = getV('part_number');
      const region  = getV('region');
      if (!partNum) { warnings.push(`Row ${i+2}: missing part number, skipped`); continue; }

      items.push({
        cycle_id:             STATE.currentCycleId,
        part_number:          partNum,
        tier:                 getV('tier'),
        base_warranty:        getV('base_warranty'),
        upgrade_description:  getV('upgrade_description'),
        delivery_type:        getV('delivery_type'),
        upgrade_years:        safeFloat(getV('upgrade_years')),
        included_adp:         getV('included_adp'),
        included_kyd:         getV('included_kyd'),
        included_sbty:        getV('included_sbty'),
        included_ticru:       getV('included_ticru'),
        included_premier:     getV('included_premier'),
        upgrade_from_type:    getV('upgrade_from_type'),
        upgrade_from_term:    getV('upgrade_from_term'),
        region:               region,
        sales_cost:           safeFloat(getV('sales_cost')),
        channel_price:        safeFloat(getV('channel_price')),
        list_price:           safeFloat(getV('list_price')),
        // computed fields (cleared on import)
        pfv: null, adj_pfv: null, c_price_calc: null,
        list_price_calc: null, gp_pct: null, pfv_status: null,
      });
    }

    // Upsert: delete existing for this cycle then bulk add
    // Use put with compound key approach: delete cycle items first, then add
    await db.price_items.where('cycle_id').equals(STATE.currentCycleId).delete();
    await db.price_items.bulkAdd(items);
    imported = items.length;

    let html = `<div class="import-summary">
      <div class="imp-count">${imported}</div>
      <div style="color:#374151;font-size:13px;margin-top:2px">rows imported successfully</div>`;
    if (warnings.length) {
      html += `<div style="margin-top:8px;font-size:12px;color:#854d0e">${warnings.slice(0,5).map(w => `<div>⚠ ${esc(w)}</div>`).join('')}${warnings.length > 5 ? `<div>…and ${warnings.length-5} more</div>` : ''}</div>`;
    }
    html += '</div>';
    summaryEl.innerHTML = html;
    toast(`Imported ${imported} rows from CSV`, 'success');
    renderImportOverview(items);
  } catch(err) {
    summaryEl.innerHTML = `<div class="alert alert-error">Import failed: ${esc(err.message)}</div>`;
    toast('CSV import failed: ' + err.message, 'error');
  }
}

function parseCsv(text) {
  const rows = [];
  const lines = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  for (const line of lines) {
    if (line.trim() === '') continue;
    rows.push(parseCsvLine(line));
  }
  return rows;
}

function parseCsvLine(line) {
  const cells = [];
  let cur = '';
  let inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (inQ) {
      if (c === '"') {
        if (line[i+1] === '"') { cur += '"'; i++; }
        else inQ = false;
      } else cur += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ',') { cells.push(cur); cur = ''; }
      else cur += c;
    }
  }
  cells.push(cur);
  return cells;
}

// ── PFV Excel Import ──

async function importPfvCsv(file) {
  const summaryEl = el('pfv-summary');
  try {
    const text = await file.text();
    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l);
    if (lines.length < 2) throw new Error('CSV has no data rows');

    // Parse header
    const headers = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/[\s_]+/g, '_'));
    const col = name => headers.indexOf(name);
    const iCol = col('tier'), yCol = col('upgrade_years'), dtCol = col('delivery_type'), vCol = col('pfv_value');
    if ([iCol, yCol, dtCol, vCol].some(i => i < 0))
      throw new Error('CSV must have columns: tier, upgrade_years, delivery_type, pfv_value');

    // Parse rows - group by (tier, year)
    const dtSuffix = dt => {
      const d = dt.toLowerCase();
      if (d.includes('exp')) return 'exp';
      if (d.includes('onsite') || d.includes('on-site')) return 'onsite';
      return 'depot';
    };
    // Populate ALL valid bwGroup columns for the given delivery suffix so that
    // any SKU (regardless of upgrade_from_term/type) finds a PFV value.
    // Valid fields per suffix: depot → d1c,d3c; exp → d1c,d3c; onsite → all five.
    const fieldsForSuffix = suffix => {
      if (suffix === 'depot') return ['d1c_depot', 'd3c_depot'];
      if (suffix === 'exp')   return ['d1c_exp',   'd3c_exp'];
      return ['d1c_onsite', 'd3c_onsite', 'd3o_onsite', 'd4c_onsite', 'd4o_onsite'];
    };

    // Accumulate into tier->year->fields map
    const rowMap = {};
    let parseErrors = 0;
    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].split(',').map(s => s.trim());
      const tierRaw = cols[iCol];
      const year = parseInt(cols[yCol], 10);
      const dt = cols[dtCol] || '';
      const val = parseFloat(cols[vCol]);
      if (!tierRaw || isNaN(year) || isNaN(val)) { parseErrors++; continue; }
      const tier = normalizeTierKey(tierRaw);
      if (!KNOWN_TIERS.includes(tier)) continue;
      if (!rowMap[tier]) rowMap[tier] = {};
      if (!rowMap[tier][year]) rowMap[tier][year] = {};
      for (const field of fieldsForSuffix(dtSuffix(dt))) {
        rowMap[tier][year][field] = val;
      }
    }

    const totalTiers = Object.keys(rowMap).length;
    if (!totalTiers) throw new Error('No recognisable tiers found. Check tier names match: ' + KNOWN_TIERS.join(', '));

    // Write to DB
    await db.pfv_rows.where('cycle_id').equals(STATE.currentCycleId).delete();
    let totalRows = 0;
    for (const [tier, yearData] of Object.entries(rowMap)) {
      for (const [year, fields] of Object.entries(yearData)) {
        await db.pfv_rows.add({
          cycle_id: STATE.currentCycleId,
          tier, year: parseInt(year),
          kyd:null, ticru:null, adp:null, sbty:null, priority:null,
          d1c_depot:null, d1c_exp:null, d1c_onsite:null,
          d3c_depot:null, d3c_exp:null, d3c_onsite:null,
          d3o_onsite:null, d4c_onsite:null, d4o_onsite:null,
          ...fields,
        });
        totalRows++;
      }
    }

    if (summaryEl) summaryEl.innerHTML = `<p class="text-success text-sm" style="margin-top:10px">Imported ${totalRows} rows from CSV.</p>`;
    toast(`PFV imported from CSV: ${totalRows} rows across ${totalTiers} tier(s)`, 'success');
    STATE.currentTab = 'pfv';
    renderNav();
  } catch(err) {
    if (summaryEl) summaryEl.innerHTML = `<div class="alert alert-error">PFV CSV import failed: ${esc(err.message)}</div>`;
    toast('PFV CSV import failed: ' + err.message, 'error');
  }
}

async function importPfvFile(file) {
  const summaryEl = el('pfv-summary');
  if (summaryEl) summaryEl.innerHTML = '<p class="text-muted text-sm" style="margin-top:10px">Reading file…</p>';
  // CSV path
  if (file.name.toLowerCase().endsWith('.csv')) {
    await importPfvCsv(file);
    return;
  }
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});

    // Find the "Coparison" sheet (intentional typo in real file)
    let sheetName = wb.SheetNames.find(n => n.toLowerCase().replace(/\s/g,'') === 'coparison');
    if (!sheetName) {
      // fallback: try "comparison" or first sheet
      sheetName = wb.SheetNames.find(n => n.toLowerCase().includes('comp')) || wb.SheetNames[0];
    }
    const ws = wb.Sheets[sheetName];
    const raw = XLSX.utils.sheet_to_json(ws, {header:1, defval:null, raw:true});

    // Parse tiers
    const tierMap = {}; // tier -> [{year, ...fields}]
    let currentTier = null;

    for (let ri = 0; ri < raw.length; ri++) {
      const row = raw[ri];
      if (!row || row.every(c => c == null)) continue;

      // Detect tier header: first non-null cell normalizes to a known tier
      const firstNonNull = row.find(c => c != null && String(c).trim() !== '');
      if (firstNonNull != null) {
        const fStr = normalizeTierKey(String(firstNonNull).trim());
        if (KNOWN_TIERS.includes(fStr)) {
          currentTier = fStr;
          if (!tierMap[currentTier]) tierMap[currentTier] = [];
          continue;
        }
      }

      if (!currentTier) continue;

      // Detect data rows: col index 1 is a number 1-5
      const yearVal = row[1];
      const yearNum = yearVal != null ? parseInt(String(yearVal).trim(), 10) : NaN;
      if (!isNaN(yearNum) && yearNum >= 1 && yearNum <= 5) {
        // Skip if this tier already has a row for this year (guards against
        // duplicate sections in the sheet, e.g. an "Original values" block).
        if (tierMap[currentTier].some(r => r.year === yearNum)) continue;
        const gf = (idx) => {
          const v = row[idx];
          if (v == null) return null;
          const n = parseFloat(String(v).replace(/[^0-9.\-]/g,''));
          return isNaN(n) ? null : n;
        };
        tierMap[currentTier].push({
          year:       yearNum,
          kyd:        gf(2),
          ticru:      gf(3),
          adp:        gf(4),
          sbty:       gf(5),
          d1c_depot:  gf(6),
          d1c_exp:    gf(7),
          d1c_onsite: gf(8),
          d3c_depot:  gf(9),
          d3c_exp:    gf(10),
          d3c_onsite: gf(11),
          d3o_onsite: gf(12),
          d4c_onsite: gf(13),
          d4o_onsite: gf(14),
          priority:   gf(15),
        });
      }
    }

    // Upsert pfv_rows for this cycle
    const totalTiers = Object.keys(tierMap).length;
    let totalRows = 0;

    // Delete existing PFV rows for this cycle
    await db.pfv_rows.where('cycle_id').equals(STATE.currentCycleId).delete();

    for (const [tier, rows] of Object.entries(tierMap)) {
      for (const rowData of rows) {
        await db.pfv_rows.add({
          cycle_id: STATE.currentCycleId,
          tier: tier,
          ...rowData
        });
        totalRows++;
      }
    }

    toast(`PFV matrix imported: ${totalRows} rows across ${totalTiers} tiers (sheet: "${sheetName}")`, 'success');
    // Switch to PFV tab so the user immediately sees the loaded matrix
    STATE.currentTab = 'pfv';
    renderNav();

  } catch(err) {
    const se = el('pfv-summary');
    if (se) se.innerHTML = `<div class="alert alert-error">PFV import failed: ${esc(err.message)}</div>`;
    toast('PFV import failed: ' + err.message, 'error');
    console.error(err);
  }
}

function selectPfvTier(tier) {

      t.className = 'pfv-tier-tab' + (t.textContent.toLowerCase() === tier ? ' active' : '');
    });
    renderPfvTable(all);
  });
}

function renderPfvTable(allPfv) {
  const tableEl = el('pfv-matrix-table');
  if (!tableEl) return;

  if (allPfv.length === 0) {
    tableEl.innerHTML = `<div class="alert alert-info" style="margin:0">No PFV data yet. Use the Import PFV button above to load a PFV Excel file.</div>`;
    return;
  }

  const tierRows = allPfv.filter(r => r.tier === STATE.pfvTier).sort((a,b) => a.year - b.year);

  if (tierRows.length === 0 && STATE.pfvTier) {
    tableEl.innerHTML = `<div class="alert alert-info">No rows for tier "${esc(STATE.pfvTier)}".</div>`;
    return;
  }

  // Column order mirrors the Excel Coparison sheet layout
  const cols = [
    {key:'year',       sub:'YR',         fmt: v => v},
    {key:'kyd',        sub:'kyd',        fmt: fmt},
    {key:'ticru',      sub:'ti cru',     fmt: fmt},
    {key:'adp',        sub:'adp',        fmt: fmt},
    {key:'sbty',       sub:'sbty',       fmt: fmt},
    {key:'d1c_depot',  sub:'depot',      fmt: fmt},
    {key:'d1c_exp',    sub:'exp depot',  fmt: fmt},
    {key:'d1c_onsite', sub:'onsite',     fmt: fmt},
    {key:'d3c_depot',  sub:'depot',      fmt: fmt},
    {key:'d3c_exp',    sub:'exp depot',  fmt: fmt},
    {key:'d3c_onsite', sub:'onsite',     fmt: fmt},
    {key:'d3o_onsite', sub:'onsite',     fmt: fmt},
    {key:'d4c_onsite', sub:'onsite',     fmt: fmt},
    {key:'d4o_onsite', sub:'onsite',     fmt: fmt},
    {key:'priority',   sub:'priority',   fmt: fmt},
  ];

  const dataRows = tierRows.map(row => {
    const cells = cols.map(c => {
      if (c.key === 'year') return `<td style="text-align:center"><b>${row.year}</b></td>`;
      const val = row[c.key] != null ? row[c.key] : '';
      return `<td><input class="editable-cell form-control-sm" type="number" step="0.01"
        value="${esc(val)}"
        data-row-id="${row.id}" data-col="${c.key}"
        onblur="savePfvCell(this)"></td>`;
    }).join('');
    return `<tr>${cells}<td><button class="btn btn-danger btn-sm" onclick="deletePfvRow(${row.id})">✕</button></td></tr>`;
  }).join('');

  // Two-level header matching Excel: group row + sub-label row
  // Groups: YR(r2) | Add-ons(c4) | 1YR cciBW(c3) | 3YR cciBW(c3) | 3YR OS BW | 4YR cciBW | 4YR OS BW | Priority(r2) | action(r2)
  const thG = (label, colspan, rowspan, extra='') =>
    `<th colspan="${colspan}" rowspan="${rowspan}" style="text-align:center;background:#2E75B6;color:#fff;font-size:11px;white-space:nowrap${extra}">${label}</th>`;
  const thS = (label) =>
    `<th style="text-align:center;background:#D6E4F7;color:#1F3864;font-size:10px;white-space:nowrap">${label}</th>`;

  const groupRow = `<tr>
    ${thG('YR',        1, 2)}
    ${thG('Add-ons',   4, 1)}
    ${thG('1YR cciBW', 3, 1)}
    ${thG('3YR cciBW', 3, 1)}
    ${thG('3YR OS BW', 1, 1)}
    ${thG('4YR cciBW', 1, 1)}
    ${thG('4YR OS BW', 1, 1)}
    ${thG('Priority',  1, 1)}
    <th rowspan="2"></th>
  </tr>`;
  const subRow = `<tr>
    ${['kyd','ti cru','adp','sbty',
       'depot','exp depot','onsite',
       'depot','exp depot','onsite',
       'onsite','onsite','onsite',
       ''].map(thS).join('')}
  </tr>`;

  tableEl.innerHTML = `
    <div class="tbl-scroll">
      <table class="tbl">
        <thead>${groupRow}${subRow}</thead>
        <tbody>${dataRows}</tbody>
      </table>
    </div>
  `;
}

async function savePfvCell(input) {
  const rowId = parseInt(input.dataset.rowId);
  const col   = input.dataset.col;
  const val   = input.value === '' ? null : parseFloat(input.value);
  try {
    await db.pfv_rows.update(rowId, {[col]: val});
    input.style.background = '#f0fdf4';
    setTimeout(() => { input.style.background = ''; }, 800);
  } catch(err) {
    toast('Save failed: ' + err.message, 'error');
  }
}

function exportStage5Results() {
  if (typeof XLSX === 'undefined') { UI.toast('XLSX library not loaded','error'); return; }
  var rows = lastResults || [];
  if (!rows.length) { UI.toast('No results to export','error'); return; }
  var ts = new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
  var exportRows = rows.map(function(r) {
    var out = {};
    for (var k in r) { out[k] = r[k]; if (r.failReason) out.Fail_Reason = r.failReason; }
    return out;
  });
  var ws = XLSX.utils.json_to_sheet(exportRows);
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Stage5_Results');
  XLSX.writeFile(wb, 'stage5_results_' + ts + '.xlsx');
  UI.toast('Exported ' + exportRows.length + ' rows','success');
}

// ── Calculation ──────────────────────────────────────────────────────────────

async function runCalculation() {
  if (!STATE.currentCycleId) { toast('No cycle selected', 'error'); return; }
  toast('Running calculation…', 'info');

  try {
    const settings = await getAllSettings();
    const pricingModel   = settings.pricing_model || 'C_TO_L';
    const topsellerEnabled = settings.topseller_enabled === 'true';
    const topsellerDiscount = parseFloat(settings.topseller_discount || '0.10');
    const gpFloorEnabled = settings.gp_floor_enabled === 'true';
    const gpFloorPct     = parseFloat(settings.gp_floor_pct || '0.30');

    const items    = await db.price_items.where('cycle_id').equals(STATE.currentCycleId).toArray();
    const pfvRows  = await db.pfv_rows.where('cycle_id').equals(STATE.currentCycleId).toArray();
    const geoGroups = await db.geo_groups.toArray();

    // Build PFV lookup: tier -> year -> pfv_row
    const pfvLookup = {};
    for (const row of pfvRows) {
      if (!pfvLookup[row.tier]) pfvLookup[row.tier] = {};
      pfvLookup[row.tier][row.year] = row;
    }

    // Build geo lookup: country -> geo_group
    const geoLookup = {}; // country uppercase -> group
    for (const g of geoGroups) {
      geoLookup[g.group_name.toUpperCase()] = g;
      const countries = g.countries.split(',').map(c => c.trim().toUpperCase());
      for (const c of countries) {
        if (c) geoLookup[c] = g;
      }
    }

    let calcCount = 0;
    let noPfvCount = 0;
    let belowFloorCount = 0;

    for (const item of items) {
      const tierKey = normalizeTierKey(item.tier);
      const year    = item.upgrade_years != null ? Math.round(item.upgrade_years) : null;

      // 1. Fetch PFV row
      const pfvRow = (tierKey && year != null) ? (pfvLookup[tierKey]?.[year] ?? null) : null;

      if (!pfvRow) {
        await db.price_items.update(item.id, {
          pfv: null, adj_pfv: null, c_price_calc: null,
          list_price_calc: null, gp_pct: null, pfv_status: 'no_pfv',
        });
        noPfvCount++;
        continue;
      }

      // 2. Determine BW group from upgrade_from_term + upgrade_from_type
      const fromTerm = safeStr(item.upgrade_from_term).toLowerCase().replace(/\s/g,'');
      const fromType = safeStr(item.upgrade_from_type).toLowerCase();
      let bwGroup = determineBwGroup(fromTerm, fromType);

      // 3. Determine delivery suffix
      const dtSuffix = determineDeliverySuffix(safeStr(item.delivery_type));

      // 4. Base PFV field
      const basePfvField = bwGroup + '_' + dtSuffix;
      const base_pfv = pfvRow[basePfvField] != null ? pfvRow[basePfvField] : 0;

      // 5 & 6. Add-on PFV
      let addon_pfv = 0;
      if (isTruthy(item.included_adp))     addon_pfv += pfvRow.adp     ?? 0;
      if (isTruthy(item.included_kyd))     addon_pfv += pfvRow.kyd     ?? 0;
      if (isTruthy(item.included_sbty))    addon_pfv += pfvRow.sbty    ?? 0;
      if (isTruthy(item.included_ticru))   addon_pfv += pfvRow.ticru   ?? 0;
      if (isTruthy(item.included_premier)) addon_pfv += pfvRow.priority ?? 0;

      // 7. PFV total
      const pfv = base_pfv + addon_pfv;

      // 8. Geo group
      const regionKey = safeStr(item.region).toUpperCase().trim();
      const geoGrp = geoLookup[regionKey] || null;
      const regional_factor = geoGrp?.regional_factor ?? 1.0;
      const ratio = geoGrp?.ratio ?? 0;

      // 9. Adjusted PFV
      const adj_pfv = pfv * regional_factor;

      // 10-11. TopSeller
      const is_topseller = topsellerEnabled && isTruthy(item.included_premier);
      const topseller_factor = is_topseller ? (1 - topsellerDiscount) : 1;

      // 12. Pricing model
      let c_price, list_price;
      if (pricingModel === 'C_TO_L') {
        c_price    = adj_pfv * topseller_factor;
        list_price = ratio > 0 ? c_price * (1 + ratio) : c_price;
      } else {
        // L_TO_C
        list_price = adj_pfv * topseller_factor;
        c_price    = ratio > 0 ? list_price * (1 - ratio) : list_price;
      }

      // 13. GP%
      const sales_cost = item.sales_cost ?? 0;
      const gp_pct = c_price > 0 ? (c_price - sales_cost) / c_price : null;

      // 14. Status
      let pfv_status;
      if (pfv <= 0) pfv_status = 'no_pfv';
      else if (gpFloorEnabled && gp_pct != null && gp_pct < gpFloorPct) pfv_status = 'below_floor';
      else pfv_status = 'ok';

      if (pfv_status === 'below_floor') belowFloorCount++;

      // 15. Update
      await db.price_items.update(item.id, {
        pfv, adj_pfv, c_price_calc: c_price,
        list_price_calc: list_price, gp_pct, pfv_status,
      });
      calcCount++;
    }

    if (document.getElementById('bridge-btn-6')) document.getElementById('bridge-btn-6').style.display = 'inline-flex';
    toast(`Calculation complete: ${calcCount} calculated, ${noPfvCount} no PFV match, ${belowFloorCount} below GP floor`, 'success');
    renderCurrentTab();
  } catch(err) {
    toast('Calculation error: ' + err.message, 'error');
    console.error(err);
  }
}

function determineBwGroup(fromTerm, fromType) {
  // fromTerm already lowercased, spaces removed
  // Detect year value from term
  const termNum = parseInt(fromTerm.replace(/[^0-9]/g, ''), 10);
  const termMonths = fromTerm.includes('m') ? parseInt(fromTerm) : (termNum * 12);

  const isDepotCci = fromType.includes('depot') || fromType.includes('cci');
  const isOnsite   = fromType.includes('onsite') || fromType.includes('on-site') || fromType === 'os';

  // 1Y / 12m CCI/Depot
  if ((termNum === 1 && !fromTerm.includes('m')) || fromTerm === '12m' || fromTerm === '1yr' || fromTerm === '1y') {
    if (isDepotCci || (!isOnsite)) return 'd1c';
  }
  // 3Y
  if ((termNum === 3 && !fromTerm.includes('m')) || fromTerm === '36m' || fromTerm === '3yr' || fromTerm === '3y') {
    if (isOnsite) return 'd3o';
    return 'd3c';
  }
  // 4Y
  if ((termNum === 4 && !fromTerm.includes('m')) || fromTerm === '48m' || fromTerm === '4yr' || fromTerm === '4y') {
    if (isOnsite) return 'd4o'; // no d4o_depot in spec, but fallback
    return 'd4c';
  }

  // Fallback by numeric term
  if (termNum === 36 || termMonths === 36) return isOnsite ? 'd3o' : 'd3c';
  if (termNum === 48 || termMonths === 48) return isOnsite ? 'd4o' : 'd4c';

  // Default: pure new purchase = d1c
  if (!fromTerm || fromTerm === '' || fromTerm === '0') return 'd1c';

  return 'd1c';
}

function determineDeliverySuffix(deliveryType) {
  const dt = deliveryType.toLowerCase();
  if (dt.includes('exp')) return 'exp';
  if (dt.includes('onsite') || dt.includes('on-site') || dt.includes(' os') || dt.endsWith('os')) return 'onsite';
  if (dt.includes('depot') || dt.includes('cci')) return 'depot';
  return 'depot'; // default
}

  `;
}

function buildExportHeaders() {
  return ['Part Number','Tier','Base Warranty','Upgrade','Delivery Type','Upgrade Years',
    'ADP','KYD','SBTY','TI CRU','Premier','Upgrade From Type','Upgrade From Term','Region',
    'Sales Cost','PFV','Adj PFV','C-Price (Calc)','List Price (Calc)','GP%','Status'];
}

function itemToExportRow(item) {
  return [
    item.part_number, item.tier, item.base_warranty, item.upgrade_description,
    item.delivery_type, item.upgrade_years,
    item.included_adp, item.included_kyd, item.included_sbty, item.included_ticru,
    item.included_premier, item.upgrade_from_type, item.upgrade_from_term, item.region,
    item.sales_cost, item.pfv, item.adj_pfv, item.c_price_calc, item.list_price_calc,
    item.gp_pct != null ? (item.gp_pct * 100).toFixed(1) + '%' : '',
    item.pfv_status || '',
  ];
}

async function exportCsv() {
  const items = await db.price_items.where('cycle_id').equals(STATE.currentCycleId).toArray();
  const headers = buildExportHeaders();
  const lines = [csvRow(headers)];
  for (const item of items) lines.push(csvRow(itemToExportRow(item)));
  const cycleName = (STATE.currentCycleName || 'export').replace(/[^a-zA-Z0-9_-]/g, '_');
  download(lines.join('\n'), `GPS_Stage5_${cycleName}.csv`, 'text/csv;charset=utf-8');
  toast('CSV downloaded', 'success');
}

async function exportExcel() {
  const items = await db.price_items.where('cycle_id').equals(STATE.currentCycleId).toArray();
  const headers = buildExportHeaders();
  const data = [headers, ...items.map(itemToExportRow)];
  const ws = XLSX.utils.aoa_to_sheet(data);
  // Style header row (basic)
  const range = XLSX.utils.decode_range(ws['!ref']);
  for (let c = range.s.c; c <= range.e.c; c++) {
    const addr = XLSX.utils.encode_cell({r:0, c});
    if (!ws[addr]) continue;
    ws[addr].s = {font:{bold:true}, fill:{fgColor:{rgb:'2D1B69'}}, font:{color:{rgb:'FFFFFF'},bold:true}};
  }
  ws['!cols'] = headers.map((h,i) => ({wch: i < 4 ? 20 : 14}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Pricing Results');
  const cycleName = (STATE.currentCycleName || 'export').replace(/[^a-zA-Z0-9_-]/g, '_');
  XLSX.writeFile(wb, `GPS_Stage5_${cycleName}.xlsx`);
  toast('Excel downloaded', 'success');
}

      <h1>Settings</h1>
    </div>

    <!-- Section 1: Pricing Model -->

      <div class="settings-section-title">Pricing Model</div>

            <div class="radio-label">L → C &nbsp;<small style="color:#6F7170;font-weight:400">(List Price First)</small></div>
            <div class="radio-desc">List Price = Adj PFV × TopSeller Factor &nbsp;|&nbsp; Channel Price = List Price × (1 − Ratio)</div>

    </div>

    <!-- Section 2: Geography Groups -->
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <div class="settings-section-title" style="margin-bottom:0">Geography Groups</div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-secondary btn-sm" onclick="addGeoGroup()">+ Add Group</button>
          <button class="btn btn-danger btn-sm" onclick="resetGeoGroups()">Reset Defaults</button>
        </div>
      </div>
      <div class="tbl-scroll">
        <table class="tbl" id="geo-table">
          <thead>
            <tr>
              <th>Group Name</th>
              <th>Countries (comma-separated)</th>
              <th>Ratio %</th>
              <th>Regional Factor</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="geo-tbody">
            ${geoRows}
          </tbody>
        </table>
      </div>
      <div class="text-sm text-muted" style="margin-top:8px">Ratio: channel-to-list markup/downlift percentage (e.g. 20 = 20%). Regional Factor: PFV multiplier (e.g. 1.1 = 10% premium).</div>
    </div>

    <!-- Section 3: TopSeller & GP Floor -->
    <div class="card">
      <div class="settings-section-title">TopSeller &amp; GP Floor</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px">
        <div>
          <div class="toggle-row">
            <input type="checkbox" id="ts-enabled" ${tsEnabled ? 'checked' : ''} onchange="saveTopSeller()">

async function savePricingModel(value) {
  await saveSetting('pricing_model', value);
  toast('Pricing model saved: ' + value, 'success');
}

async function saveTopSeller() {
  const enabled  = el('ts-enabled')?.checked ? 'true' : 'false';
  const discount = parseFloat(el('ts-discount')?.value || '10') / 100;
  await saveSetting('topseller_enabled',  enabled);
  await saveSetting('topseller_discount', discount.toFixed(4));
  toast('TopSeller settings saved', 'success');
}

async function saveGpFloor() {
  const enabled = el('gp-enabled')?.checked ? 'true' : 'false';
  const floor   = parseFloat(el('gp-floor')?.value || '30') / 100;
  await saveSetting('gp_floor_enabled', enabled);
  await saveSetting('gp_floor_pct',     floor.toFixed(4));
  toast('GP Floor settings saved', 'success');
}

// Geo group helpers
const _geoPendingChanges = {}; // id -> field -> value

async function updateGeoField(id, field, value) {
  try {
    const update = {[field]: value};
    await db.geo_groups.update(id, update);
  } catch(err) {
    toast('Save failed: ' + err.message, 'error');
  }
}

async function deleteGeoGroup(id) {
  if (!confirm('Delete this geo group?')) return;
  await db.geo_groups.delete(id);
  toast('Group deleted', 'info');
  renderCurrentTab();
}

function addGeoGroup() {
  openModal('New Geography Group',
    `<div class="form-row form-row-2">
       <div class="form-group">
         <label class="form-label">Group Name *</label>
         <input id="new-geo-name" class="form-control" placeholder="e.g. MEA" autofocus>
       </div>
       <div class="form-group">
         <label class="form-label">Ratio (e.g. 0.20 = 20%)</label>
         <input id="new-geo-ratio" class="form-control" type="number" step="0.01" min="0" max="5" value="0.20">
       </div>
     </div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary" onclick="createGeoGroupFromModal()">Add Group</button>`
  );
  setTimeout(() => {
    const n = document.getElementById('new-geo-name');
    if (n) { n.focus(); n.addEventListener('keydown', e => { if(e.key==='Enter') createGeoGroupFromModal(); }); }
  }, 50);
}

async function createGeoGroupFromModal() {
  const nameEl  = document.getElementById('new-geo-name');
  const ratioEl = document.getElementById('new-geo-ratio');
  const trimmed = (nameEl ? nameEl.value : '').trim().toUpperCase();
  if (!trimmed) { toast('Group name is required', 'error'); return; }
  const ratio = parseFloat(ratioEl ? ratioEl.value : '0.20') || 0.20;
  closeModal();
  try {
    await db.geo_groups.add({group_name: trimmed, countries: '', ratio: ratio, regional_factor: 1.0});
    toast('Group "' + trimmed + '" added', 'success');
    renderCurrentTab();
  } catch(err) {
    toast('Failed to add group (name may already exist): ' + err.message, 'error');
  }
}

async function resetGeoGroups() {
  if (!confirm('Reset all geography groups to defaults? This will delete any custom groups.')) return;
  await db.geo_groups.clear();
  await db.geo_groups.bulkAdd(DEFAULT_GEO_GROUPS);
  toast('Geography groups reset to defaults', 'success');
  renderCurrentTab();
}

function doLogin() {
  const name = el('login-name').value.trim();
  if (!name) { toast('Please enter your name', 'error'); return; }
  currentUser = name;

function logout() {
  localStorage.removeItem('gps_user');
  currentUser = null;
  el('app').innerHTML = '';
  renderLogin();
}
